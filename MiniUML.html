<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniUML — Editor de diagramas UML</title>
<style>
:root, html[data-theme="dark"]{
  --bg:#0f1319; --panel:#171c24; --panel2:#1e242e; --panel3:#252d39;
  --border:#2b3441; --text:#e6ebf2; --muted:#94a1b2; --accent:#5b8def;
  --accentSoft:rgba(91,141,239,.16); --danger:#e2585c; --ok:#3fb27f;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --field:#111721; --fieldText:#e9eef6; --fieldBorder:#394453; --ph:#7e8b9c;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#e9edf3; --panel:#ffffff; --panel2:#f4f7fb; --panel3:#e8edf5;
  --border:#d3dae5; --text:#141a22; --muted:#5c6878; --accent:#2f6bd8;
  --accentSoft:rgba(47,107,216,.12); --danger:#c8474b; --ok:#2f9268;
  --shadow:0 8px 24px rgba(20,30,50,.12);
  --field:#ffffff; --fieldText:#141a22; --fieldBorder:#c3ccda; --ph:#8a94a3;
  color-scheme:light;
}
html[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:13px/1.45 "Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text);
  display:grid; grid-template-rows:auto auto minmax(0,1fr) auto;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- controles de formulario (explícitos en los dos temas) ---------- */
input,select,textarea{
  font:inherit; background-color:var(--field); color:var(--fieldText);
  border:1px solid var(--fieldBorder); border-radius:6px; padding:5px 7px;
}
textarea{resize:vertical;min-height:56px;line-height:1.45}
select{padding-right:5px}
option,optgroup{background-color:var(--panel);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--ph);opacity:1}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent); outline:none; box-shadow:0 0 0 2px var(--accentSoft);
}
input:disabled,select:disabled,textarea:disabled{
  background-color:var(--panel3); color:var(--muted); border-color:var(--border);
  cursor:not-allowed; opacity:1;
}
input[type=checkbox],input[type=radio]{
  width:auto; accent-color:var(--accent); background:none; border:0; padding:0; margin:0;
}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:14px;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;font-size:14px;white-space:nowrap}
.brand .mark{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#8f6bf0);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text)}
.tb:disabled{color:var(--muted)}
.tb.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent)}
.tb:hover{background:var(--panel3)}
.tb:disabled{opacity:.42;cursor:default}
.tb.icon{padding:5px 8px}
.spacer{flex:1}
.sel{display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}
.menuWrap{position:relative}
.menu{position:absolute;z-index:60;top:calc(100% + 5px);left:0;min-width:190px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:5px;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:6px}
.menu button:hover{background:var(--accentSoft)}

/* ---------- diagram tabs ---------- */
#tabsbar{display:flex;align-items:stretch;gap:6px;padding:5px 10px;background:var(--panel2);border-bottom:1px solid var(--border);overflow-x:auto}
#tabs{display:flex;gap:5px}
.tab{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--panel3)}
.tab.active{background:var(--panel);border-color:var(--border);color:var(--text);font-weight:600}
.tab .x{opacity:.5;font-size:14px;line-height:1}
.tab .x:hover{opacity:1;color:var(--danger)}
#btnAddDiagram{background:var(--panel);border:1px dashed var(--border);border-radius:6px;color:var(--muted);padding:2px 10px}

/* ---------- main layout ---------- */
main{display:grid;grid-template-columns:196px minmax(0,1fr) 292px;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#right{border-right:0;border-left:1px solid var(--border)}
.side-h{padding:9px 12px;font-weight:600;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#tools,#props{overflow:auto;padding:9px;flex:1}
.toolgrp{margin:2px 0 12px}
.toolgrp h4{margin:0 0 6px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.4px}
.tool{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:1px solid transparent;border-radius:7px;padding:6px 8px;text-align:left;color:var(--text)}
.tool:hover{background:var(--panel2)}
.tool.active{background:var(--accentSoft);border-color:var(--accent);color:var(--text);font-weight:600}
.tool svg{flex:0 0 auto;color:var(--muted)}
.tool.active svg{color:var(--accent)}

/* ---------- stage ---------- */
#stage{position:relative;min-width:0;background:#fff;overflow:hidden}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#canvas.tool-add{cursor:crosshair}
#canvas.tool-link{cursor:cell}
#canvas.panning{cursor:grabbing}
/* Vive sobre el lienzo, que siempre es blanco: se declara claro a propósito,
   independiente del tema de la interfaz. */
#inlineEdit{
  position:absolute; display:none; z-index:20; color-scheme:light;
  border:1.5px solid #2f6bd8; border-radius:4px; background-color:#ffffff; color:#111820;
  padding:2px 5px; font:600 13px "Segoe UI",Arial,sans-serif; box-shadow:0 3px 10px rgba(0,0,0,.25);
}
#inlineEdit::placeholder{color:#98a2b1;opacity:1}
#inlineEdit:focus{outline:none;box-shadow:0 0 0 2px rgba(47,107,216,.28)}
#zoombar{position:absolute;left:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:var(--shadow);z-index:15}
#zoombar button{background:transparent;border:0;color:var(--text);border-radius:5px;padding:4px 8px}
#zoombar button:hover{background:var(--panel3)}
#zoombar button.on{background:var(--accentSoft);color:var(--accent)}
#zoomVal{min-width:52px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#hint{position:absolute;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--muted);box-shadow:var(--shadow);z-index:15;max-width:320px;display:none}

/* ---------- Diseño Orientado a Objetos ---------- */
#oop{
  position:absolute; inset:0; z-index:35; display:none;
  grid-template-rows:auto minmax(0,1fr) auto;
  background:var(--bg); color:var(--text); border-left:1px solid var(--border);
}
#oop.show{display:grid}
.oop-head{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--border);
}
.oop-head h3{margin:0;font-size:14px;font-weight:700;white-space:nowrap}
.oop-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.oop-body{overflow:auto;padding:14px;background:var(--bg)}
#oopTable{
  width:100%; min-width:660px; border-collapse:collapse;
  background:var(--panel); border:1px solid var(--border); border-radius:8px;
}
#oopTable th,#oopTable td{border:1px solid var(--border);padding:7px 9px;vertical-align:top;text-align:left}
#oopTable thead th{
  background:var(--panel2); color:var(--text); font-size:11.5px; font-weight:700;
  letter-spacing:.3px; position:sticky; top:0; z-index:1;
}
#oopTable th.c1,#oopTable td.c1{width:24%}
#oopTable th.c4,#oopTable td.c4{width:66px}
#oopTable tbody tr:nth-child(even) td{background:var(--panel2)}
#oopTable input,#oopTable textarea{width:100%;display:block}
#oopTable textarea{min-height:62px;resize:vertical;font-size:12.5px;line-height:1.5;overflow:auto}
#oopTable input.bad,#oopTable textarea.bad{border-color:var(--danger);box-shadow:0 0 0 2px rgba(200,71,75,.22)}
#oopTable td.c4{white-space:nowrap;text-align:center}
#oopTable td.c4 .mini{margin:2px 1px}
.oop-empty{color:var(--muted);margin:14px 2px;line-height:1.6}
.oop-foot{padding:8px 14px;border-top:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:11.5px}
::selection{background:var(--accent);color:#fff}

/* ---------- properties ---------- */
.f{display:block;margin:0 0 9px}
.f>span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rowlist{display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
.row{display:grid;gap:4px;align-items:center}
.row.attr{grid-template-columns:46px 1fr 1fr auto}
.row.meth{grid-template-columns:46px 1fr 1fr auto}
.row.slot{grid-template-columns:1fr 1fr auto}
.row.msg{grid-template-columns:34px 1fr 44px auto}
.rowbtns{display:flex;gap:2px}
.rowbtns .mini{padding:3px 4px;font-size:11px;line-height:1}
.row input,.row select{padding:4px 5px;font-size:12px;min-width:0}
.mini{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:3px 6px;color:var(--muted);line-height:1}
.mini:hover{color:var(--danger);border-color:var(--danger)}
.addbtn{width:100%;background:var(--panel2);border:1px dashed var(--border);border-radius:6px;padding:5px;color:var(--muted)}
.addbtn:hover{color:var(--accent);border-color:var(--accent)}
.pgroup{border-top:1px solid var(--border);margin-top:12px;padding-top:11px}
.pgroup h5{margin:0 0 8px;font-size:11px;color:var(--muted);font-weight:600}
.badge{display:inline-block;background:var(--accentSoft);color:var(--accent);border-radius:5px;padding:2px 7px;font-size:11px;font-weight:600;margin-bottom:10px}
.actions{display:flex;gap:6px;margin-top:12px}
.actions .tb{flex:1;text-align:center}
.tb.danger:hover{border-color:var(--danger);color:var(--danger)}
.empty{color:var(--muted);line-height:1.6}
.empty kbd{background:var(--panel2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;font-size:11px;font-family:inherit}
label.check{display:flex;align-items:center;gap:7px;color:var(--muted);margin:0 0 8px}

/* ---------- status ---------- */
#status{display:flex;justify-content:space-between;gap:12px;padding:5px 12px;background:var(--panel);border-top:1px solid var(--border);color:var(--muted);font-size:11.5px}
#saveState{white-space:nowrap}
#saveState.saved{color:var(--ok)}
#saveState.dirty{color:var(--accent)}

/* ---------- context menu, toasts, modal ---------- */
#ctx{position:fixed;z-index:200;min-width:180px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:5px;display:none}
#ctx button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:6px;color:var(--text)}
#ctx button:hover{background:var(--accentSoft)}
#ctx hr{border:0;border-top:1px solid var(--border);margin:4px 2px}
#toasts{position:fixed;z-index:300;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:9px 13px;box-shadow:var(--shadow);max-width:330px;white-space:pre-line;line-height:1.5}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
#modal{position:fixed;inset:0;z-index:400;background:rgba(6,10,16,.55);display:none;place-items:center}
#modal.open{display:grid}
#modal .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:18px;width:min(420px,92vw)}
#modal h3{margin:0 0 10px;font-size:15px}
#modal p{margin:0 0 14px;color:var(--muted);line-height:1.55}
#modal input,#modal select,#modal textarea{width:100%;margin-bottom:14px}

@media (max-width:1080px){ main{grid-template-columns:170px minmax(0,1fr) 250px} }
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  .side{position:absolute;z-index:40;top:0;bottom:0;width:230px;box-shadow:var(--shadow);display:none}
  .side.show{display:flex}
  #left{left:0} #right{right:0;left:auto}
  main{position:relative}
  #panelToggles{display:flex !important}
}
#panelToggles{display:none;gap:4px}
</style>
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="mark">U</span>MiniUML</div>
  <div class="group">
    <button class="tb" id="btnNew" title="Crear un proyecto vacío">Nuevo</button>
    <button class="tb" id="btnSave" title="Guardar el proyecto en este navegador (Ctrl+S)">Guardar</button>
    <button class="tb" id="btnLoad" title="Abrir un archivo .miniuml.json">Cargar</button>
    <div class="menuWrap">
      <button class="tb" id="btnExport" title="Exportar proyecto o diagrama">Exportar ▾</button>
      <div class="menu" id="exportMenu">
        <button data-x="json">Proyecto (.json)</button>
        <button data-x="svg">Diagrama actual (.svg)</button>
        <button data-x="png">Diagrama actual (.png)</button>
      </div>
    </div>
    <button class="tb" id="btnUndo" title="Deshacer (Ctrl+Z)">Deshacer</button>
    <button class="tb" id="btnRedo" title="Rehacer (Ctrl+Y)">Rehacer</button>
    <button class="tb" id="btnExample" title="Cargar el proyecto de demostración">Ejemplo</button>
    <button class="tb" id="btnOop" title="Tabla Clase / Atributos / Métodos para armar el diagrama de clases">Diseño OO</button>
  </div>
  <div class="spacer"></div>
  <div class="group" id="panelToggles">
    <button class="tb icon" id="btnLeftPanel" title="Herramientas">▤</button>
    <button class="tb icon" id="btnRightPanel" title="Propiedades">▥</button>
  </div>
  <label class="sel">Tipo de diagrama <select id="selType"></select></label>
  <button class="tb icon" id="btnTheme" title="Cambiar entre modo oscuro y claro">☾</button>
</header>

<div id="tabsbar">
  <div id="tabs"></div>
  <button id="btnAddDiagram" title="Agregar un diagrama del tipo seleccionado">+</button>
</div>

<main>
  <aside class="side" id="left">
    <div class="side-h"><span>Herramientas</span></div>
    <div id="tools"></div>
  </aside>
  <section id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <input id="inlineEdit" type="text" autocomplete="off">
    <div id="zoombar">
      <button id="zOut" title="Alejar">−</button>
      <span id="zoomVal">100%</span>
      <button id="zIn" title="Acercar">+</button>
      <button id="zFit" title="Ajustar al contenido">Ajustar</button>
      <button id="zGrid" title="Mostrar u ocultar la cuadrícula">Cuadrícula</button>
      <button id="zSnap" title="Ajustar elementos a la cuadrícula">Imantar</button>
    </div>
    <div id="hint"></div>
    <section id="oop" aria-label="Diseño Orientado a Objetos">
      <header class="oop-head">
        <h3>Diseño Orientado a Objetos</h3>
        <div class="oop-actions">
          <button class="tb" id="oopAdd" title="Agregar una fila a la tabla">+ Agregar clase</button>
          <button class="tb" id="oopSync" title="Crear o actualizar estas clases en el diagrama (no crea relaciones)">Sincronizar con diagrama</button>
          <button class="tb" id="oopCopy" title="Copiar como tabla para pegar en Word o Docs">Copiar tabla</button>
          <button class="tb" id="oopCopyTxt" title="Copiar como texto estructurado">Copiar texto</button>
          <button class="tb icon" id="oopClose" title="Cerrar (Esc)">✕</button>
        </div>
      </header>
      <div class="oop-body">
        <table id="oopTable">
          <thead><tr><th class="c1">Clase</th><th>Atributos</th><th>Métodos</th><th class="c4"></th></tr></thead>
          <tbody id="oopRows"></tbody>
        </table>
        <p class="oop-empty" id="oopEmpty">Todavía no hay clases. Usá <b>+ Agregar clase</b> y escribí un atributo o método por línea.</p>
      </div>
      <footer class="oop-foot" id="oopFoot"></footer>
    </section>
  </section>
  <aside class="side" id="right">
    <div class="side-h"><span>Propiedades</span></div>
    <div id="props"></div>
  </aside>
</main>

<footer id="status"><span id="stLeft"></span><span id="saveState" class="saved" title="Estado del guardado en este navegador">✓ Guardado</span><span id="stRight"></span></footer>

<div id="ctx"></div>
<div id="toasts"></div>
<div id="modal"><div class="box"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
/* =========================================================================
   MiniUML — editor UML de un solo archivo
   1. Núcleo: utilidades, paleta, definiciones de diagramas y herramientas
   ========================================================================= */
'use strict';
const APP_NAME = 'MiniUML', APP_VERSION = '1.0';
const NS = 'http://www.w3.org/2000/svg';
const FONT = "'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

const uid = (p) => (p || 'x') + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clone = (o) => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const measure = (t, s) => String(t == null ? '' : t).length * (s || 12) * 0.56;
const nowName = () => new Date().toISOString().slice(0, 10);

/* Paleta del lienzo: siempre clara, para que los diagramas se lean y se
   exporten igual en modo oscuro y en modo claro. */
const P = {
  ink: '#1c2530', fill: '#ffffff', soft: '#f2f5fa', grid: '#e3e8f0',
  muted: '#5f6b7c', sel: '#2f6bd8', selSoft: 'rgba(47,107,216,.10)', bad: '#c8474b'
};

/* ---------- creación de nodos SVG ---------- */
function el(tag, attrs, kids) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) { const v = attrs[k]; if (v !== null && v !== undefined) n.setAttribute(k, v); }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(c => { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
function txt(x, y, s, o) {
  o = o || {};
  const t = el('text', {
    x: x, y: y, 'font-family': FONT, 'font-size': o.size || 12,
    fill: o.fill || P.ink, 'text-anchor': o.anchor || 'start',
    'font-weight': o.weight || null, 'font-style': o.italic ? 'italic' : null,
    'text-decoration': o.underline ? 'underline' : null,
    'pointer-events': 'none'
  }, String(s == null ? '' : s));
  if (o.halo) { t.setAttribute('stroke', P.fill); t.setAttribute('stroke-width', 3.2); t.setAttribute('paint-order', 'stroke'); t.setAttribute('stroke-linejoin', 'round'); }
  return t;
}
const line = (x1, y1, x2, y2, o) => el('line', Object.assign({ x1, y1, x2, y2, stroke: P.ink, 'stroke-width': 1.4 }, o || {}));
const path = (d, o) => el('path', Object.assign({ d, fill: 'none', stroke: P.ink, 'stroke-width': 1.4 }, o || {}));

/* ---------- tipos de diagrama ---------- */
const DIAGRAMS = {
  usecase: { name: 'Diagrama de Casos de Uso', short: 'Casos de Uso' },
  class: { name: 'Diagrama de Clases', short: 'Clases' },
  object: { name: 'Diagrama de Objetos', short: 'Objetos' },
  state: { name: 'Diagrama de Estados', short: 'Estados' },
  sequence: { name: 'Diagrama de Secuencia', short: 'Secuencia' },
  communication: { name: 'Diagrama de Comunicación', short: 'Comunicación' },
  deployment: { name: 'Diagrama de Despliegue', short: 'Despliegue' }
};
const DIAGRAM_ORDER = ['usecase', 'class', 'object', 'state', 'sequence', 'communication', 'deployment'];

/* ---------- valores por defecto de cada elemento ---------- */
const EDEF = {
  actor: { w: 74, h: 96, name: 'Actor' },
  usecase: { w: 158, h: 68, name: 'Caso de uso' },
  boundary: { w: 460, h: 360, name: 'Sistema' },
  class: { w: 186, h: 96, name: 'Clase' },
  interface: { w: 186, h: 84, name: 'Interfaz' },
  object: { w: 190, h: 70, name: 'objeto', className: 'Clase' },
  initial: { w: 24, h: 24, name: '' },
  state: { w: 148, h: 58, name: 'Estado' },
  final: { w: 28, h: 28, name: '' },
  participant: { w: 148, h: 46, name: 'Participante' },
  activation: { w: 12, h: 90, name: '' },

/* Regla UML única: la usan tanto la creación interactiva como la validación
   del JSON, para que un archivo cargado no pueda introducir relaciones que la
   herramienta no dejaría dibujar. */
function relationCheck(dtype, type, A, B) {
  const rule = (RULES[dtype] || {})[type];
  if (!rule) return { ok: false, why: 'diagram' };
  if (A.id === B.id && ['transition', 'message', 'return'].indexOf(type) < 0) return { ok: false, why: 'self' };
  const ok = rule.pairs
    ? rule.pairs.some(p => p[0] === A.type && p[1] === B.type)
    : (rule.from.indexOf(A.type) >= 0 && rule.to.indexOf(B.type) >= 0 && (!rule.same || A.type === B.type));
  return { ok: ok, why: ok ? '' : 'types' };
}

/* Nombre legible de cada tipo de elemento, para los mensajes de validación. */
const TYPE_LABEL = {
  actor: 'Actor', usecase: 'Caso de uso', boundary: 'Límite del sistema', class: 'Clase',
  interface: 'Interfaz', object: 'Objeto', initial: 'Estado inicial', state: 'Estado',
  final: 'Estado final', participant: 'Participante', activation: 'Activación',
  fragment: 'Fragmento', role: 'Rol', node: 'Nodo', artifact: 'Artefacto'
};
const TYPE_NAME = (t) => TYPE_LABEL[t] || t;

/* Texto de la regla: «qué se puede unir con qué» para un tipo de relación. */
function ruleText(dtype, type) {
  const rule = (RULES[dtype] || {})[type];
  if (!rule) return '—';
  if (rule.pairs) return rule.pairs.map(p => TYPE_NAME(p[0]) + ' → ' + TYPE_NAME(p[1])).join('\n');
  const from = rule.from.map(TYPE_NAME).join(' / '), to = rule.to.map(TYPE_NAME).join(' / ');
  return from + ' → ' + to + (rule.same ? '  (los dos del mismo tipo)' : '');
}

const VIS = ['+', '-', '#', '~'];

const ElementFactory = {
  create(type, x, y, variant) {
    const d = EDEF[type] || { w: 140, h: 70, name: type };
    const e = { id: uid(type), type: type, x: Math.round(x), y: Math.round(y), w: d.w, h: d.h, name: d.name };
    if (type === 'class') { e.attributes = [{ vis: '-', name: 'atributo', type: 'String' }]; e.methods = [{ vis: '+', name: 'operacion', params: '', ret: 'void' }]; e.stereotype = ''; e.abstract = false; }
    if (type === 'interface') { e.attributes = []; e.methods = [{ vis: '+', name: 'operacion', params: '', ret: 'void' }]; e.stereotype = 'interface'; }
    if (type === 'object' || type === 'role') { e.className = d.className; e.slots = type === 'object' ? [{ name: 'atributo', value: '"valor"' }] : []; }
    if (type === 'participant') { e.variant = variant || 'object'; e.className = ''; if (e.variant === 'actor') { e.w = 84; e.h = 78; e.name = 'Actor'; } }
    if (type === 'activation') { e.owner = null; }
    if (type === 'fragment') { e.op = 'alt'; e.guard = '[condición]'; e.guard2 = '[si no]'; e.split = 0.5; }
    if (type === 'node') { e.stereotype = 'device'; }
    if (type === 'artifact') { e.stereotype = 'artifact'; }
    if (type === 'state') { e.doActivity = ''; }
    return e;
  },
  relation(type, from, to, routing) {
    const r = { id: uid('r'), type: type, from: from, to: to, label: '', points: [], routing: routing || 'direct' };
    if (RDEF[type] && RDEF[type].mult) {
      r.sourceMultiplicity = ''; r.targetMultiplicity = '';
      r.sourceRole = ''; r.targetRole = '';
      r.sourceNavigable = false; r.targetNavigable = false;
    }
    if (type === 'transition') { r.event = 'evento'; r.guard = ''; r.action = ''; }
    if (type === 'connector') r.messages = [];
    return r;
  }
};

/* ---------- geometría ---------- */
const Geo = {
  attrText: (a) => (a.vis ? a.vis + ' ' : '') + (a.name || '') + (a.type ? ' : ' + a.type : ''),
  methText: (m) => (m.vis ? m.vis + ' ' : '') + (m.name || '') + '(' + (m.params || '') + ')' + (m.ret ? ' : ' + m.ret : ''),
  slotText: (s) => (s.name || '') + ' = ' + (s.value == null ? '' : s.value),
  objTitle: (e) => (e.name || '') + (e.className ? (e.name ? ' : ' : ': ') + e.className : ''),

  classHead(e) { return 26 + ((e.stereotype && e.stereotype !== 'class') ? 14 : 0); },

  /* Tamaño mínimo que necesita el elemento para mostrar su contenido.
     Es la única fuente de verdad: la usan bounds(), el redimensionado y
     el panel de propiedades. */
  minSize(e) {
    switch (e.type) {
      case 'class': case 'interface': {
        const at = e.attributes || [], me = e.methods || [];
        let w = measure(e.name, 13.5) + 34;
        if (e.stereotype) w = Math.max(w, measure('«' + e.stereotype + '»', 11.5) + 30);
        at.forEach(a => w = Math.max(w, measure(Geo.attrText(a), 12) + 26));
        me.forEach(m => w = Math.max(w, measure(Geo.methText(m), 12) + 26));
        return { w: Math.max(110, Math.round(w)), h: Geo.classHead(e) + Math.max(1, at.length) * 16 + 10 + Math.max(1, me.length) * 16 + 10 };
      }
      case 'object': {
        const sl = e.slots || [];
        let w = measure(Geo.objTitle(e), 13) + 34;
        sl.forEach(s => w = Math.max(w, measure(Geo.slotText(s), 12) + 26));
        return { w: Math.max(110, Math.round(w)), h: 28 + Math.max(1, sl.length) * 16 + 10 };
      }
      case 'role': return { w: Math.max(110, Math.round(measure(Geo.objTitle(e), 13) + 30)), h: 44 };
      case 'participant': return e.variant === 'actor'
        ? { w: 84, h: 78 }
        : { w: Math.max(110, Math.round(measure(Geo.objTitle(e), 13) + 30)), h: 46 };
      case 'usecase': return { w: Math.max(110, Math.round(measure(e.name, 12.5) * 0.62 + 60)), h: 56 };
      case 'state': return {
        w: Math.max(100, Math.round(Math.max(measure(e.name, 13) + 34, e.doActivity ? measure('do / ' + e.doActivity, 11.5) + 30 : 0))),
        h: e.doActivity ? 58 : 46
      };
      case 'artifact': return { w: Math.max(110, Math.round(measure(e.name, 12.5) + 46)), h: 52 };
      case 'node': return { w: Math.max(150, Math.round(measure(e.name, 13) + 60)), h: 96 };
      case 'boundary': return { w: 200, h: 150 };
      case 'fragment': return { w: 170, h: 80 };
      case 'activation': return { w: 12, h: 20 };
      case 'actor': return { w: 74, h: 96 };
      case 'initial': return { w: 24, h: 24 };
      case 'final': return { w: 28, h: 28 };
      default: return { w: 80, h: 40 };
    }
  },
  /* Mínimo de un contenedor teniendo en cuenta a sus hijos declarados. */
  minSizeIn(d, e) {
    const m = Geo.minSize(e);
    if (!d || CONTAINERS.indexOf(e.type) < 0) return m;
    let w = m.w, h = m.h;
    Geo.childrenOf(d, e).forEach(c => {
      const b = Geo.bounds(d, c);
      w = Math.max(w, b.x - e.x + b.w + 14);
      h = Math.max(h, b.y - e.y + b.h + 14);
    });
    return { w: Math.round(w), h: Math.round(h) };
  },
  childrenOf(d, e) { return (d.elements || []).filter(o => o.parentId === e.id); },
  /* Hijos, nietos… con protección contra referencias circulares. */
  descendants(d, e, acc, depth) {
    acc = acc || []; depth = depth || 0;
    if (depth > 12) return acc;
    Geo.childrenOf(d, e).forEach(c => {
      if (acc.indexOf(c) >= 0) return;
      acc.push(c); Geo.descendants(d, c, acc, depth + 1);
    });
    return acc;
  },

  bounds(d, e) {
    if (!e) return { x: 0, y: 0, w: 0, h: 0 };
    if (e.type === 'activation') {
      const o = d && (d.elements || []).find(p => p.id === e.owner);
      const x = o ? Geo.lifelineX(d, o) : e.x;                 // siempre sobre su línea de vida
      return { x: x - 6, y: e.y, w: 12, h: Math.max(20, e.h || 80) };
    }
    const m = Geo.minSize(e);
    const fixedH = ['participant', 'actor', 'initial', 'final'].indexOf(e.type) >= 0;
    return {
      x: e.x, y: e.y,
      w: Math.max(m.w, Math.round(e.w || 0)),
      h: fixedH ? m.h : Math.max(m.h, Math.round(e.h || 0))
    };
  },
  center(b) { return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; },
  lifelineX(d, p) { const b = Geo.bounds(d, p); return Math.round(b.x + b.w / 2); },
  lifelineTop(d, p) { const b = Geo.bounds(d, p); return b.y + b.h; },
  lifelineBottom(d) {
    let m = 480;
    (d.relations || []).forEach(r => { if (r.y) m = Math.max(m, r.y + 60); });
    (d.elements || []).forEach(e => { if (e.type === 'activation') m = Math.max(m, e.y + (e.h || 80) + 40); if (e.type === 'fragment') m = Math.max(m, e.y + e.h + 40); });
    return m;
  },

  /* Caja realmente ocupada por el dibujo (el actor reserva sitio abajo para
     su nombre; las líneas no deben apuntar a ese hueco). */
  shapeBox(d, e) {
    const b = Geo.bounds(d, e);
    if (e.type === 'node') return { x: b.x, y: b.y + 15, w: b.w - 15, h: b.h - 15 };   // cara frontal
    if (e.type === 'actor') return { x: b.x + 14, y: b.y, w: b.w - 28, h: b.h - 24 };
    if (e.type === 'participant' && e.variant === 'actor') return { x: b.x + 20, y: b.y, w: b.w - 40, h: b.h - 22 };
    return b;
  },
  anchor(d, e, toPt) {
    const b = Geo.shapeBox(d, e), c = Geo.center(b);
    if (e.type === 'usecase') return Geo.ellipseAnchor(b, c, toPt);
    if (e.type === 'initial' || e.type === 'final') return Geo.circleAnchor(b, c, toPt);
    if (e.type === 'state') return Geo.roundRectAnchor(b, c, toPt, 13);
    return Geo.rectAnchor(b, c, toPt);
  },
  /* Rectángulo redondeado: se busca el borde real, esquinas incluidas. */
  roundRectAnchor(b, c, pt, rad) {
    const r = Math.min(rad, b.w / 2, b.h / 2);
    const inside = (p) => {
      if (p.x < b.x || p.x > b.x + b.w || p.y < b.y || p.y > b.y + b.h) return false;
      const dx = Math.max(b.x + r - p.x, 0, p.x - (b.x + b.w - r));
      const dy = Math.max(b.y + r - p.y, 0, p.y - (b.y + b.h - r));
      return dx === 0 || dy === 0 || dx * dx + dy * dy <= r * r;
    };
    const vx = pt.x - c.x, vy = pt.y - c.y, L = Math.hypot(vx, vy);
    if (!L) return c;
    const ux = vx / L, uy = vy / L;
    let lo = 0, hi = Math.hypot(b.w, b.h) / 2 + 2;
    for (let i = 0; i < 22; i++) {
      const m = (lo + hi) / 2;
      if (inside({ x: c.x + ux * m, y: c.y + uy * m })) lo = m; else hi = m;
    }
    return { x: c.x + ux * lo, y: c.y + uy * lo };
  },
  rectAnchor(b, c, pt) {
    const dx = pt.x - c.x, dy = pt.y - c.y;
    if (!dx && !dy) return c;
    const sx = dx === 0 ? Infinity : (b.w / 2) / Math.abs(dx);
    const sy = dy === 0 ? Infinity : (b.h / 2) / Math.abs(dy);
    const s = Math.min(sx, sy);
    return { x: c.x + dx * s, y: c.y + dy * s };
  },
  ellipseAnchor(b, c, pt) {
    const dx = pt.x - c.x, dy = pt.y - c.y, a = b.w / 2, k = b.h / 2;
    if (!dx && !dy) return c;
    const t = 1 / Math.sqrt((dx * dx) / (a * a) + (dy * dy) / (k * k));
    return { x: c.x + dx * t, y: c.y + dy * t };
  },
  circleAnchor(b, c, pt) {
    const dx = pt.x - c.x, dy = pt.y - c.y, r = b.w / 2, L = Math.hypot(dx, dy) || 1;
    return { x: c.x + dx / L * r, y: c.y + dy / L * r };
  },
  inside(b, p) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; },

  /* ---------- ruteo de relaciones ---------- */
  segHitsBox(a, b, box, pad) {
    const p = pad || 6;
    const r = { x: box.x - p, y: box.y - p, w: box.w + p * 2, h: box.h + p * 2 };
    const x1 = Math.min(a.x, b.x), x2 = Math.max(a.x, b.x);
    const y1 = Math.min(a.y, b.y), y2 = Math.max(a.y, b.y);
    if (x2 < r.x || x1 > r.x + r.w || y2 < r.y || y1 > r.y + r.h) return false;
    if (a.x === b.x || a.y === b.y) return true;                 // segmentos ortogonales
    return Geo.distToSeg({ x: r.x + r.w / 2, y: r.y + r.h / 2 }, a, b) < Math.max(r.w, r.h) / 2;
  },
  /* ¿El segmento atraviesa algún elemento que no sea uno de los extremos? */
  crossesAny(d, a, b, skip) {
    return (d.elements || []).some(e => {
      if (skip.indexOf(e.id) >= 0 || e.type === 'activation' || CONTAINERS.indexOf(e.type) >= 0) return false;
      return Geo.segHitsBox(a, b, Geo.shapeBox(d, e));
    });
  },
  sideX(b, right) { return right ? b.x + b.w : b.x; },
  sideY(b, down) { return down ? b.y + b.h : b.y; },

  /* Ruta ortogonal automática entre dos elementos: recta si están alineados,
     con dos codos si no. El corredor intenta no cruzar otros elementos. */
  /* ¿Alguna parte de la polilínea atraviesa un elemento ajeno? */
  routeCrosses(d, pts, skip) {
    for (let i = 1; i < pts.length; i++) if (Geo.crossesAny(d, pts[i - 1], pts[i], skip)) return true;
    return false;
  },
  /* Primera ruta candidata que no atraviesa nada; si todas fallan, la primera. */
  firstClear(d, cands, skip) {
    for (let i = 0; i < cands.length; i++) if (!Geo.routeCrosses(d, cands[i], skip)) return cands[i];
    return cands[0];
  },

  orthoRoute(d, A, B) {
    const ba = Geo.shapeBox(d, A), bb = Geo.shapeBox(d, B);
    const ca = Geo.center(ba), cb = Geo.center(bb);
    const skip = [A.id, B.id];
    const ovTop = Math.max(ba.y, bb.y), ovBot = Math.min(ba.y + ba.h, bb.y + bb.h);
    const ovLef = Math.max(ba.x, bb.x), ovRig = Math.min(ba.x + ba.w, bb.x + bb.w);
    if (ovBot - ovTop >= 18) {
      const y = Math.round((ovTop + ovBot) / 2), right = cb.x > ca.x;
      const recta = [{ x: Geo.sideX(ba, right), y: y }, { x: Geo.sideX(bb, !right), y: y }];
      if (!Geo.routeCrosses(d, recta, skip)) return recta;
      /* Hay algo en el medio: se rodea por arriba o por abajo. */
      const lanes = Geo.lanes(d, ba, bb, skip, false);
      const cands = lanes.map(yl => [
        { x: Math.round(ca.x), y: Geo.sideY(ba, yl > ca.y) }, { x: Math.round(ca.x), y: yl },
        { x: Math.round(cb.x), y: yl }, { x: Math.round(cb.x), y: Geo.sideY(bb, yl > cb.y) }
      ]);
      return Geo.firstClear(d, cands.concat([recta]), skip);
    }
    if (ovRig - ovLef >= 18) {
      const x = Math.round((ovLef + ovRig) / 2), down = cb.y > ca.y;
      const recta = [{ x: x, y: Geo.sideY(ba, down) }, { x: x, y: Geo.sideY(bb, !down) }];
      if (!Geo.routeCrosses(d, recta, skip)) return recta;
      const lanes = Geo.lanes(d, ba, bb, skip, true);
      const cands = lanes.map(xl => [
        { x: Geo.sideX(ba, xl > ca.x), y: Math.round(ca.y) }, { x: xl, y: Math.round(ca.y) },
        { x: xl, y: Math.round(cb.y) }, { x: Geo.sideX(bb, xl > cb.x), y: Math.round(cb.y) }
      ]);
      return Geo.firstClear(d, cands.concat([recta]), skip);
    }
    const horiz = Math.abs(cb.x - ca.x) >= Math.abs(cb.y - ca.y);
    if (horiz) {
      const right = cb.x > ca.x;
      const a0 = { x: Geo.sideX(ba, right), y: Math.round(ca.y) };
      const b0 = { x: Geo.sideX(bb, !right), y: Math.round(cb.y) };
      const cands = [Math.round((a0.x + b0.x) / 2), a0.x + (right ? 26 : -26), b0.x + (right ? -26 : 26)];
      let xm = cands[0];
      for (let i = 0; i < cands.length; i++) {
        const k1 = { x: cands[i], y: a0.y }, k2 = { x: cands[i], y: b0.y };
        if (!Geo.crossesAny(d, a0, k1, skip) && !Geo.crossesAny(d, k1, k2, skip) && !Geo.crossesAny(d, k2, b0, skip)) { xm = cands[i]; break; }
      }
      return [a0, { x: xm, y: a0.y }, { x: xm, y: b0.y }, b0];
    }
    const down = cb.y > ca.y;
    const a0 = { x: Math.round(ca.x), y: Geo.sideY(ba, down) };
    const b0 = { x: Math.round(cb.x), y: Geo.sideY(bb, !down) };
    const cands = [Math.round((a0.y + b0.y) / 2), a0.y + (down ? 26 : -26), b0.y + (down ? -26 : 26)];
    let ym = cands[0];
    for (let i = 0; i < cands.length; i++) {
      const k1 = { x: a0.x, y: cands[i] }, k2 = { x: b0.x, y: cands[i] };
      if (!Geo.crossesAny(d, a0, k1, skip) && !Geo.crossesAny(d, k1, k2, skip) && !Geo.crossesAny(d, k2, b0, skip)) { ym = cands[i]; break; }
    }
    return [a0, { x: a0.x, y: ym }, { x: b0.x, y: ym }, b0];
  },

  /* Carriles candidatos para rodear los obstáculos que hay entre dos cajas:
     por encima/por debajo (o izquierda/derecha si vertical es true). */
  lanes(d, ba, bb, skip, vertical) {
    const x1 = Math.min(ba.x, bb.x), x2 = Math.max(ba.x + ba.w, bb.x + bb.w);
    const y1 = Math.min(ba.y, bb.y), y2 = Math.max(ba.y + ba.h, bb.y + bb.h);
    let lo = vertical ? x1 : y1, hi = vertical ? x2 : y2;
    (d.elements || []).forEach(e => {
      if (skip.indexOf(e.id) >= 0 || e.type === 'activation' || CONTAINERS.indexOf(e.type) >= 0) return;
      const b = Geo.shapeBox(d, e);
      if (b.x > x2 || b.x + b.w < x1 || b.y > y2 || b.y + b.h < y1) return;   // fuera del corredor
      lo = Math.min(lo, vertical ? b.x : b.y);
      hi = Math.max(hi, vertical ? b.x + b.w : b.y + b.h);
    });
    return [Math.round(lo - 34), Math.round(hi + 34)];
  },

  /* Punto de salida ortogonal hacia un punto dado (para waypoints manuales). */
  orthoEnd(d, e, t) {
    const b = Geo.shapeBox(d, e), c = Geo.center(b);
    if (t.y > b.y + 6 && t.y < b.y + b.h - 6) return { x: Geo.sideX(b, t.x > c.x), y: t.y };
    if (t.x > b.x + 6 && t.x < b.x + b.w - 6) return { x: t.x, y: Geo.sideY(b, t.y > c.y) };
    return Geo.anchor(d, e, t);
  },
  /* Inserta codos entre puntos que no están alineados. */
  elbows(pts) {
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const a = out[out.length - 1], b = pts[i];
      if (Math.abs(a.x - b.x) > 0.5 && Math.abs(a.y - b.y) > 0.5) out.push({ x: b.x, y: a.y });
      out.push(b);
    }
    return out;
  },

  /* Polilínea completa de una relación: extremos anclados al borde real. */
  /* Desplazamiento perpendicular de una relación cuando hay varias rectas
     entre el mismo par de elementos. */
  siblingOffset(d, r) {
    if ((r.points || []).length || r.routing === 'orthogonal') return 0;
    const sibs = (d.relations || []).filter(x => !(x.points || []).length && x.routing !== 'orthogonal' &&
      ((x.from === r.from && x.to === r.to) || (x.from === r.to && x.to === r.from)));
    if (sibs.length < 2) return 0;
    return (sibs.indexOf(r) - (sibs.length - 1) / 2) * 18;
  },

  route(d, r) {
    const A = byIdIn(d, r.from), B = byIdIn(d, r.to);
    if (!A || !B) return null;
    const mids = (r.points || []).filter(p => p && isFinite(p.x) && isFinite(p.y)).map(p => ({ x: +p.x, y: +p.y }));
    const ortho = r.routing === 'orthogonal';
    if (!mids.length) {
      if (ortho) return Geo.orthoRoute(d, A, B);
      const ca = Geo.center(Geo.shapeBox(d, A)), cb = Geo.center(Geo.shapeBox(d, B));
      let p1 = Geo.anchor(d, A, cb), p2 = Geo.anchor(d, B, ca);
      const off = Geo.siblingOffset(d, r);
      if (off) {
        /* Se apunta a un objetivo corrido en perpendicular: las dos líneas se
           separan pero cada extremo sigue apoyado en el borde de su elemento. */
        const a = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const q1 = { x: p1.x + Math.cos(a + Math.PI / 2) * off, y: p1.y + Math.sin(a + Math.PI / 2) * off };
        const q2 = { x: p2.x + Math.cos(a + Math.PI / 2) * off, y: p2.y + Math.sin(a + Math.PI / 2) * off };
        p1 = Geo.anchor(d, A, q1); p2 = Geo.anchor(d, B, q2);
      }
      return [p1, p2];
    }
    if (ortho) {
      const p1 = Geo.orthoEnd(d, A, mids[0]), p2 = Geo.orthoEnd(d, B, mids[mids.length - 1]);
      return Geo.elbows([p1].concat(mids, [p2]));
    }
    return [Geo.anchor(d, A, mids[0])].concat(mids, [Geo.anchor(d, B, mids[mids.length - 1])]);
  },
  /* Longitud acumulada y punto medio real de una polilínea. */
  polyMid(pts) {
    let total = 0;
    for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    let half = total / 2;
    for (let i = 1; i < pts.length; i++) {
      const L = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (half <= L || i === pts.length - 1) {
        const t = L ? half / L : 0;
        return {
          x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t,
          y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t,
          ang: Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x)
        };
      }
      half -= L;
    }
    return { x: pts[0].x, y: pts[0].y, ang: 0 };
  },
  inEllipse(b, p) {
    const dx = (p.x - (b.x + b.w / 2)) / (b.w / 2), dy = (p.y - (b.y + b.h / 2)) / (b.h / 2);
    return dx * dx + dy * dy <= 1;
  },
  distToSeg(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
    let t = L ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L : 0;
    t = clamp(t, 0, 1);
    return Math.hypot(p.x - (a.x + dx * t), p.y - (a.y + dy * t));
  },
  contentBox(d) {
    let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9, any = false;
    (d.elements || []).forEach(e => {
      const b = Geo.bounds(d, e); any = true;
      x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y);
      x2 = Math.max(x2, b.x + b.w); y2 = Math.max(y2, b.y + b.h);
      if (d.type === 'sequence' && e.type === 'participant') y2 = Math.max(y2, Geo.lifelineBottom(d));
    });
    if (!any) return { x: 0, y: 0, w: 600, h: 400 };
    return { x: x1, y: y1, w: Math.max(40, x2 - x1), h: Math.max(40, y2 - y1) };
  }
};

/* ---------- historial ---------- */
class HistoryManager {
  constructor(limit) { this.limit = limit || 60; this.stack = []; this.i = -1; }
  reset(state) { this.stack = [clone(state)]; this.i = 0; }
  push(state) {
    this.stack = this.stack.slice(0, this.i + 1);
    this.stack.push(clone(state));
    if (this.stack.length > this.limit) this.stack.shift();
    this.i = this.stack.length - 1;
  }
  canUndo() { return this.i > 0; }
  canRedo() { return this.i < this.stack.length - 1; }
  undo() { if (!this.canUndo()) return null; this.i--; return clone(this.stack[this.i]); }
  redo() { if (!this.canRedo()) return null; this.i++; return clone(this.stack[this.i]); }
}

/* ---------- almacenamiento ---------- */
const KEY = 'miniuml.project.v1', KEY_UI = 'miniuml.ui.v1';
const StorageManager = {
  save(doc) { try { localStorage.setItem(KEY, JSON.stringify(doc)); return true; } catch (e) { return false; } },
  load() {
    try { const s = localStorage.getItem(KEY); return s ? Doc.validate(JSON.parse(s)) : null; }
    catch (e) { return null; }
  },
  saveUI(o) { try { localStorage.setItem(KEY_UI, JSON.stringify(o)); } catch (e) { } },
  loadUI() { try { return JSON.parse(localStorage.getItem(KEY_UI) || '{}') || {}; } catch (e) { return {}; } }
};

/* ---------- documento del proyecto ---------- */
const Doc = {
  empty(name) {
    const d = Doc.newDiagram('class', 'Diagrama de Clases');
    return {
      application: APP_NAME, version: APP_VERSION,
      project: { id: uid('p'), name: name || 'Proyecto sin título', created: nowName(), diagrams: [d], activeId: d.id }
    };
  },
  newDiagram(type, name) {
    return {
      id: uid('d'), type: type, name: name || DIAGRAMS[type].short,
      options: { numbered: type === 'sequence' || type === 'communication' },
      elements: [], relations: []
    };
  },
  /* Contenedor que corresponde a un elemento según dónde está su centro.
     Devuelve el más pequeño de los compatibles, para que un nodo dentro de
     otro nodo capture al artefacto que tiene encima. */
  containerAt(d, e, strict) {
    const cands = PARENT_OF[e.type];
    if (!cands || !cands.length) return null;
    const b = Geo.bounds(d, e), c = Geo.center(b);
    let best = null, area = Infinity;
    (d.elements || []).forEach(o => {
      if (o.id === e.id || cands.indexOf(o.type) < 0) return;
      const ob = Geo.bounds(d, o);
      /* Al soltar basta con el centro; al deducir la contención de un archivo
         viejo se exige que el elemento entre entero, para no adoptar de más. */
      const ok = strict
        ? (b.x >= ob.x && b.y >= ob.y && b.x + b.w <= ob.x + ob.w && b.y + b.h <= ob.y + ob.h)
        : Geo.inside(ob, c);
      if (!ok) return;
      let up = o, guard = 0;                                  // no adoptar a un ancestro propio
      while (up && guard++ < 12) { if (up.id === e.id) return; up = byIdIn(d, up.parentId); }
      const a = ob.w * ob.h;
      if (a < area) { area = a; best = o; }
    });
    return best;
  },

  /* Fragmento que encierra a un mensaje (el más chico, si hay anidados). */
  fragmentAt(d, r) {
    const A = byIdIn(d, r.from), B = byIdIn(d, r.to);
    if (!A || !B) return null;
    const x = (Geo.lifelineX(d, A) + Geo.lifelineX(d, B)) / 2, y = r.y || 0;
    let best = null, area = Infinity;
    (d.elements || []).forEach(e => {
      if (e.type !== 'fragment') return;
      const b = Geo.bounds(d, e);
      if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) return;
      const a = b.w * b.h;
      if (a < area) { area = a; best = e; }
    });
    return best;
  },
  /* Vincula un mensaje al fragmento que lo contiene (contención explícita). */
  assignFragment(d, r) {
    if (!d || d.type !== 'sequence' || ['message', 'return'].indexOf(r.type) < 0) return;
    const f = Doc.fragmentAt(d, r);
    if (f) r.parentId = f.id; else delete r.parentId;
  },
  assignFragments(d) {
    if (!d || d.type !== 'sequence') return;
    (d.relations || []).forEach(r => Doc.assignFragment(d, r));
  },

  /* Numeración estable de los mensajes de secuencia: manda el orden vertical y,
     ante un empate, el número que ya tenían. */
  renumber(d) {
    if (!d || d.type !== 'sequence') return [];
    const ms = (d.relations || []).slice()
      .sort((a, b) => (a.y || 0) - (b.y || 0) || (a.seq || 0) - (b.seq || 0));
    ms.forEach((r, i) => { r.seq = i + 1; });
    return ms;
  },

  /* Comprueba y normaliza un documento cargado; lanza error si no es válido.
     Cada diagrama se valida por separado (no se usan índices del arreglo
     original) y lo que queda nunca puede referenciar algo inexistente. */
  validate(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('vacío');
    const pr = raw.project;
    if (!pr || !Array.isArray(pr.diagrams)) throw new Error('estructura');

    const dropped = { diagrams: 0, elements: 0, relations: 0 };
    const used = {};
    const uniq = (id, pre) => {
      let v = (typeof id === 'string' && id) ? id : uid(pre);
      if (used[v]) v = uid(pre);
      used[v] = 1; return v;
    };
    const num = (v, def) => { const n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : (def || 0); };
    const str = (v) => v == null ? '' : String(v);
    const arr = (v) => Array.isArray(v) ? v : [];
    const diagrams = [];

    pr.diagrams.forEach(src => {
      if (!src || typeof src !== 'object' || !DIAGRAMS[src.type]) { dropped.diagrams++; return; }
      const type = src.type;
      const d = {
        id: uniq(src.id, 'd'), type: type, name: str(src.name) || DIAGRAMS[type].short,
        options: { numbered: (src.options && typeof src.options.numbered === 'boolean') ? src.options.numbered : (type === 'sequence' || type === 'communication') },
        elements: [], relations: []
      };

      /* 1. elementos: el tipo tiene que existir y pertenecer a este diagrama */
      arr(src.elements).forEach(o => {
        if (!o || typeof o !== 'object' || !EDEF[o.type] || ALLOWED_EL[type].indexOf(o.type) < 0) { dropped.elements++; return; }
        const e = Object.assign({}, clone(EDEF[o.type]), clone(o));
        e.id = uniq(o.id, o.type);
        e.x = Math.round(num(e.x, 0)); e.y = Math.round(num(e.y, 0));
        e.w = Math.max(8, Math.round(num(e.w, EDEF[o.type].w)));
        e.h = Math.max(8, Math.round(num(e.h, EDEF[o.type].h)));
        e.name = str(e.name);
        if (e.type === 'class' || e.type === 'interface') {
          e.attributes = arr(e.attributes).map(a => ({ vis: VIS_ANY.indexOf(str(a && a.vis)) >= 0 ? str(a.vis) : '-', name: str(a && a.name), type: str(a && a.type) }));
          e.methods = arr(e.methods).map(m => ({ vis: VIS_ANY.indexOf(str(m && m.vis)) >= 0 ? str(m.vis) : '+', name: str(m && m.name), params: str(m && m.params), ret: str(m && m.ret) }));
          e.stereotype = str(e.stereotype); e.abstract = !!e.abstract;
        }
        if (e.type === 'object' || e.type === 'role') {
          e.className = str(e.className);
          e.slots = arr(e.slots).map(v => ({ name: str(v && v.name), value: str(v && v.value) }));
        }
        if (e.type === 'participant') { e.variant = e.variant === 'actor' ? 'actor' : 'object'; e.className = str(e.className); }
        if (e.type === 'fragment') {
          e.op = ['alt', 'opt', 'loop', 'par', 'ref'].indexOf(e.op) >= 0 ? e.op : 'alt';
          e.guard = str(e.guard); e.guard2 = str(e.guard2); e.split = num(e.split, 0.5);
        }
        if (e.type === 'state') e.doActivity = str(e.doActivity);
        if (e.type === 'node' || e.type === 'artifact') e.stereotype = str(e.stereotype);
        d.elements.push(e);
      });

      const map = {};
      d.elements.forEach(e => { map[e.id] = e; });

      /* Filas del panel «Diseño Orientado a Objetos»: solo se guarda lo mínimo,
         una referencia por cada clase ya creada y el texto de las que no. */
      if (type === 'class') {
        const filas = arr(src.oop).map(r => {
          if (!r || typeof r !== 'object') return null;
          if (r.ref) return map[r.ref] && map[r.ref].type === 'class' ? { ref: str(r.ref) } : null;
          const f = { name: str(r.name), attrs: str(r.attrs), methods: str(r.methods) };
          return (f.name || f.attrs || f.methods) ? f : null;
        }).filter(Boolean);
        if (filas.length) d.oop = filas;
      }

      /* 2. activaciones huérfanas: su propietario debe ser un participante real */
      d.elements = d.elements.filter(e => {
        if (e.type !== 'activation') return true;
        const o = map[e.owner];
        if (!o || o.type !== 'participant') { delete map[e.id]; dropped.elements++; return false; }
        return true;
      });

      /* 3. contenedores: la referencia debe existir, aceptar ese hijo y no ciclar */
      d.elements.forEach(e => {
        if (!e.parentId) { delete e.parentId; return; }
        const p = map[e.parentId];
        if (!p || p.id === e.id || !CONTAINS[p.type] || CONTAINS[p.type].indexOf(e.type) < 0) { delete e.parentId; return; }
        let up = p, guard = 0;
        while (up && up.parentId && guard++ < 20) {
          if (up.parentId === e.id) { delete e.parentId; return; }
          up = map[up.parentId];
        }
      });

      /* 3b. archivos de la versión 1.0: no traían contención explícita, así que
         se deduce una sola vez y queda guardada a partir de ahora. */
      d.elements.forEach(e => {
        if (e.parentId || !PARENT_OF[e.type]) return;
        const host = Doc.containerAt(d, e, true);
        if (host) e.parentId = host.id;
      });

      /* 4. relaciones: tipo admitido, extremos vivos y combinación válida en UML */
      arr(src.relations).forEach(o => {
        if (!o || typeof o !== 'object' || !RDEF[o.type] || ALLOWED_REL[type].indexOf(o.type) < 0) { dropped.relations++; return; }
        const A = map[o.from], B = map[o.to];
        if (!A || !B || !relationCheck(type, o.type, A, B).ok) { dropped.relations++; return; }
        const r = Object.assign({ label: '' }, clone(o));
        r.id = uniq(o.id, 'r'); r.label = str(r.label);
        /* Nombres nuevos de los extremos; los proyectos anteriores usaban
           fromMult/toMult/fromRole/toRole/navigable y se migran acá. */
        if (RDEF[r.type].mult) {
          r.sourceMultiplicity = str(r.sourceMultiplicity != null && r.sourceMultiplicity !== '' ? r.sourceMultiplicity : r.fromMult);
          r.targetMultiplicity = str(r.targetMultiplicity != null && r.targetMultiplicity !== '' ? r.targetMultiplicity : r.toMult);
          r.sourceRole = str(r.sourceRole != null && r.sourceRole !== '' ? r.sourceRole : r.fromRole);
          r.targetRole = str(r.targetRole != null && r.targetRole !== '' ? r.targetRole : r.toRole);
          r.sourceNavigable = !!r.sourceNavigable;
          r.targetNavigable = r.targetNavigable != null ? !!r.targetNavigable : !!r.navigable;
        }
        delete r.fromMult; delete r.toMult; delete r.fromRole; delete r.toRole; delete r.navigable;
        r.points = arr(r.points).map(q => ({ x: Math.round(num(q && q.x, 0)), y: Math.round(num(q && q.y, 0)) }))
          .filter(q => isFinite(q.x) && isFinite(q.y));
        r.routing = r.routing === 'orthogonal' ? 'orthogonal' : 'direct';
        if (r.labelPosition && isFinite(num(r.labelPosition.dx, NaN)) && isFinite(num(r.labelPosition.dy, NaN))) {
          r.labelPosition = { dx: Math.round(num(r.labelPosition.dx, 0)), dy: Math.round(num(r.labelPosition.dy, 0)) };
        } else delete r.labelPosition;
        if (r.type === 'transition') { r.event = str(r.event); r.guard = str(r.guard); r.action = str(r.action); }
        if (r.type === 'connector') {
          r.messages = arr(r.messages).map(m => ({ n: str(m && m.n), text: str(m && m.text), dir: (m && m.dir === 'ba') ? 'ba' : 'ab' }));
        }
        if (type === 'sequence') {
          r.y = Math.round(num(r.y, 150)); r.seq = Math.round(num(r.seq, 0));
          const f = r.parentId ? map[r.parentId] : null;      // solo un fragmento del mismo diagrama
          if (!f || f.type !== 'fragment') delete r.parentId;
        } else delete r.parentId;
        d.relations.push(r);
      });

      if (type === 'sequence') {
        /* Archivos anteriores: se deduce una vez qué mensajes encierra cada fragmento. */
        d.relations.forEach(r => { if (!r.parentId) Doc.assignFragment(d, r); });
      }
      Doc.renumber(d);
      diagrams.push(d);
    });

    if (!diagrams.length) throw new Error('sin diagramas');
    Doc.lastReport = dropped;
    return {
      application: APP_NAME, version: raw.version || APP_VERSION,
      project: {
        id: uniq(pr.id, 'p'), name: str(pr.name) || 'Proyecto', created: str(pr.created) || nowName(),
        diagrams: diagrams,
        activeId: diagrams.some(d => d.id === pr.activeId) ? pr.activeId : diagrams[0].id
      }
    };
  },
  lastReport: { diagrams: 0, elements: 0, relations: 0 },
  droppedCount() { const r = Doc.lastReport || {}; return (r.diagrams || 0) + (r.elements || 0) + (r.relations || 0); }
};

/* Búsqueda de un elemento por id dentro de un diagrama (sin depender de la app). */
function byIdIn(d, id) { return id ? (d.elements || []).find(e => e.id === id) || null : null; }

/* =========================================================================
   Diseño Orientado a Objetos: tabla Clase / Atributos / Métodos.
   No es un modelo aparte: cada fila apunta a una clase real del diagrama y
   el texto se traduce a la misma estructura {vis, name, type} que ya usa
   MiniUML. Lo único que se guarda a parte son las filas todavía no creadas.
   ========================================================================= */
const Oop = {
  /* ---------- texto <-> modelo ---------- */
  /* Una línea puede venir como «- nombre : String», «nombre» o «+ pagar(x) : void».
     Se conserva lo que el usuario escribió; no se completan tipos ni visibilidad. */
  splitVis(line) {
    const t = String(line == null ? '' : line).trim();
    const c = t.charAt(0);
    if (VIS.indexOf(c) >= 0) return { vis: c, rest: t.slice(1).trim() };
    return { vis: '', rest: t };
  },
  parseAttr(line) {
    const v = Oop.splitVis(line);
    const i = v.rest.indexOf(':');
    if (i < 0) return { vis: v.vis, name: v.rest, type: '' };
    return { vis: v.vis, name: v.rest.slice(0, i).trim(), type: v.rest.slice(i + 1).trim() };
  },
  parseMethod(line) {
    const v = Oop.splitVis(line);
    const a = v.rest.indexOf('('), b = v.rest.lastIndexOf(')');
    if (a >= 0 && b > a) {
      const resto = v.rest.slice(b + 1).trim();
      const ret = resto.charAt(0) === ':' ? resto.slice(1).trim() : (resto || '');
      return { vis: v.vis, name: v.rest.slice(0, a).trim(), params: v.rest.slice(a + 1, b).trim(), ret: ret };
    }
    const i = v.rest.indexOf(':');
    if (i < 0) return { vis: v.vis, name: v.rest, params: '', ret: '' };
    return { vis: v.vis, name: v.rest.slice(0, i).trim(), params: '', ret: v.rest.slice(i + 1).trim() };
  },
  /* Cada línea no vacía es un atributo o un método; se respeta el orden escrito. */
  parseList(text, kind) {
    return String(text == null ? '' : text).split(/\r?\n/)
      .map(l => l.trim()).filter(l => l.length)
      .map(l => kind === 'meth' ? Oop.parseMethod(l) : Oop.parseAttr(l));
  },
  attrsText(e) { return (e.attributes || []).map(Geo.attrText).join('\n'); },
  methodsText(e) { return (e.methods || []).map(Geo.methText).join('\n'); },

  /* ---------- filas ---------- */
  rowFrom(e) {
    return { rid: uid('fila'), ref: e.id, name: e.name || '', attrs: Oop.attrsText(e), methods: Oop.methodsText(e) };
  },
  emptyRow() { return { rid: uid('fila'), ref: null, name: '', attrs: '', methods: '' }; },
  /* Reconstruye la tabla: primero el orden guardado, después cualquier clase
     del diagrama que todavía no esté en la tabla (proyectos anteriores). */
  rowsFrom(d) {
    const rows = [], used = {};
    if (!d || d.type !== 'class') return rows;
    (d.oop || []).forEach(r => {
      if (r.ref) {
        const e = byIdIn(d, r.ref);
        if (!e || e.type !== 'class' || used[e.id]) return;
        used[e.id] = 1; rows.push(Oop.rowFrom(e));
      } else {
        rows.push({ rid: uid('fila'), ref: null, name: r.name || '', attrs: r.attrs || '', methods: r.methods || '' });
      }
    });
    (d.elements || []).forEach(e => {
      if (e.type !== 'class' || used[e.id]) return;
      used[e.id] = 1; rows.push(Oop.rowFrom(e));
    });
    return rows;
  },
  /* Guarda en el documento lo mínimo para volver a armar la tabla. */
  save(d, rows) {
    if (!d || d.type !== 'class') return;
    const out = [];
    (rows || []).forEach(r => {
      if (r.ref && byIdIn(d, r.ref)) { out.push({ ref: r.ref }); return; }
      if ((r.name || '').trim() || (r.attrs || '').trim() || (r.methods || '').trim()) {
        out.push({ name: r.name || '', attrs: r.attrs || '', methods: r.methods || '' });
      }
    });
    if (out.length) d.oop = out; else delete d.oop;
  },

  /* ---------- colocación de las clases nuevas ---------- */
  /* Cuadrícula determinista debajo de lo que ya hay en el lienzo. */
  place(d, news) {
    const previos = (d.elements || []).filter(e => news.indexOf(e) < 0);
    let x0 = 60, y0 = 60;
    if (previos.length) {
      let x1 = 1e9, y2 = -1e9;
      previos.forEach(e => { const b = Geo.bounds(d, e); x1 = Math.min(x1, b.x); y2 = Math.max(y2, b.y + b.h); });
      x0 = Math.round(x1 / 10) * 10; y0 = Math.round((y2 + 60) / 10) * 10;
    }
    let x = x0, y = y0, altoFila = 0, col = 0;
    news.forEach(e => {
      e.x = x; e.y = y;                                  // bounds necesita la posición
      const m = Geo.bounds(d, e);                        // tamaño real dibujado, no el mínimo
      if (col >= 3 || (col > 0 && x + m.w > x0 + 1240)) { x = x0; y += altoFila + 70; altoFila = 0; col = 0; e.x = x; e.y = y; }
      x += Math.round((m.w + 80) / 10) * 10;
      altoFila = Math.max(altoFila, m.h);
      col++;
    });
  },

  /* ---------- sincronización tabla -> modelo -> diagrama ---------- */
  check(rows) {
    const vistos = {};
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i], nombre = (r.name || '').trim();
      if (!nombre) {
        if ((r.attrs || '').trim() || (r.methods || '').trim()) return { error: 'sinNombre', rid: r.rid, fila: i + 1 };
        continue;
      }
      const k = nombre.toLowerCase();
      if (vistos[k]) return { error: 'duplicada', rid: r.rid, nombre: nombre };
      vistos[k] = 1;
    }
    return null;
  },
  sync(d, rows) {
    const mal = Oop.check(rows);
    if (mal) return mal;
    let creadas = 0, actualizadas = 0;
    const news = [];
    rows.forEach(r => {
      const nombre = (r.name || '').trim();
      if (!nombre) return;
      const atts = Oop.parseList(r.attrs, 'attr'), mets = Oop.parseList(r.methods, 'meth');
      let e = r.ref ? byIdIn(d, r.ref) : null;
      if (e && e.type !== 'class') e = null;
      if (!e) e = (d.elements || []).find(x => x.type === 'class' && (x.name || '').trim().toLowerCase() === nombre.toLowerCase());
      if (e) {
        /* Se tocan solo nombre, atributos y métodos: id, posición, tamaño,
           estereotipo y todo lo demás quedan como estaban. */
        const cambio = e.name !== nombre ||
          JSON.stringify(e.attributes || []) !== JSON.stringify(atts) ||
          JSON.stringify(e.methods || []) !== JSON.stringify(mets);
        e.name = nombre; e.attributes = atts; e.methods = mets;
        r.ref = e.id;
        if (cambio) actualizadas++;
      } else {
        const ne = ElementFactory.create('class', 0, 0);
        ne.name = nombre; ne.attributes = atts; ne.methods = mets;
        d.elements.push(ne); news.push(ne); r.ref = ne.id; creadas++;
      }
    });
    if (news.length) Oop.place(d, news);
    Oop.save(d, rows);
    return { creadas: creadas, actualizadas: actualizadas };
  },

  /* ---------- copiado ---------- */
  usables(rows) { return (rows || []).filter(r => (r.name || '').trim()); },
  html(rows) {
    const esc2 = (s) => String(s == null ? '' : s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const lineas = (s) => esc2(s).split(/\r?\n/).filter(l => l.trim()).join('<br>');
    const th = 'border:1px solid #808080;padding:6px 10px;background:#e8eaee;font-weight:bold;text-align:left;font-family:Segoe UI,Arial,sans-serif;font-size:11pt';
    const td = 'border:1px solid #808080;padding:6px 10px;vertical-align:top;font-family:Segoe UI,Arial,sans-serif;font-size:11pt';
    let h = '<table style="border-collapse:collapse;border:1px solid #808080">' +
      '<thead><tr><th style="' + th + '">Clase</th><th style="' + th + '">Atributos</th><th style="' + th + '">Métodos</th></tr></thead><tbody>';
    Oop.usables(rows).forEach(r => {
      h += '<tr><td style="' + td + '"><b>' + esc2((r.name || '').trim()) + '</b></td>' +
        '<td style="' + td + '">' + lineas(r.attrs) + '</td>' +
        '<td style="' + td + '">' + lineas(r.methods) + '</td></tr>';
    });
    return h + '</tbody></table>';
  },
  text(rows) {
    const bloques = Oop.usables(rows).map(r => {
      const at = String(r.attrs || '').split(/\r?\n/).filter(l => l.trim());
      const me = String(r.methods || '').split(/\r?\n/).filter(l => l.trim());
      return 'Clase: ' + (r.name || '').trim() + '\n' +
        'Atributos:\n' + (at.length ? at.map(l => l.trim()).join('\n') : '(ninguno)') + '\n\n' +
        'Métodos:\n' + (me.length ? me.map(l => l.trim()).join('\n') : '(ninguno)');
    });
    return 'Diseño Orientado a Objetos\n\n' + bloques.join('\n\n---\n\n') + '\n';
  }
};

/* Portapapeles: se intenta la API moderna con HTML y, si el navegador no
   deja, se cae a una selección temporal. Nunca rompe la aplicación. */
const Clip = {
  async rich(html, text) {
    try {
      if (typeof navigator !== 'undefined' && navigator.clipboard && typeof ClipboardItem !== 'undefined') {
        await navigator.clipboard.write([new ClipboardItem({
          'text/html': new Blob([html], { type: 'text/html' }),
          'text/plain': new Blob([text], { type: 'text/plain' })
        })]);
        return true;
      }
    } catch (e) { }
    try {
      const host = document.createElement('div');
      host.setAttribute('contenteditable', 'true');
      host.style.cssText = 'position:fixed;left:-10000px;top:0;opacity:0';
      host.innerHTML = html;
      document.body.appendChild(host);
      const sel = window.getSelection(), rg = document.createRange();
      rg.selectNodeContents(host);
      sel.removeAllRanges(); sel.addRange(rg);
      const listo = !!(document.execCommand && document.execCommand('copy'));
      sel.removeAllRanges(); host.remove();
      if (listo) return true;
    } catch (e) { }
    return await Clip.plain(text);
  },
  async plain(text) {
    try {
      if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-10000px;top:0';
      document.body.appendChild(ta);
      ta.select();
      const listo = !!(document.execCommand && document.execCommand('copy'));
      ta.remove();
      return listo;
    } catch (e) { }
    return false;
  }
};
/* =========================================================================
   3. Dibujo: representación UML de cada elemento y de cada relación
   ========================================================================= */

const byId = (d, id) => (d.elements || []).find(e => e.id === id);
const ptAt = (p, a, dist, perp) => ({
  x: p.x + Math.cos(a) * dist + Math.cos(a + Math.PI / 2) * (perp || 0),
  y: p.y + Math.sin(a) * dist + Math.sin(a + Math.PI / 2) * (perp || 0)
});
function wrapText(s, max, maxLines) {
  const words = String(s || '').split(/\s+/).filter(Boolean), lines = [];
  let cur = '';
  words.forEach(w => {
    if (!cur) cur = w;
    else if ((cur + ' ' + w).length <= max) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    const rest = lines.slice(maxLines - 1).join(' ');
    return lines.slice(0, maxLines - 1).concat([rest]);
  }
  return lines.length ? lines : [''];
}

const Render = {

  /* Etiqueta legible sobre una línea: recuadro blanco + texto. */
  tag(x, y, s, o) {
    o = o || {};
    const size = o.size || 11.5, w = measure(s, size) + 9, h = size + 5;
    const g = el('g');
    const x0 = o.anchor === 'middle' ? x - w / 2 : x - 4;
    Render._tags.push({ x: x0, y: y - size + 1, w: w, h: h });
    const e = Render._ext;                       // extensión real del dibujo, etiquetas incluidas
    e.x1 = Math.min(e.x1, x0); e.y1 = Math.min(e.y1, y - size + 1);
    e.x2 = Math.max(e.x2, x0 + w); e.y2 = Math.max(e.y2, y + 5);
    g.appendChild(el('rect', { x: x0, y: y - size + 1, width: w, height: h, fill: P.fill, rx: 2 }));
    g.appendChild(txt(x, y, s, { size: size, anchor: o.anchor, fill: o.fill }));
    return g;
  },

  /* Busca un sitio libre para una etiqueta: si el punto cae sobre otro
     elemento del diagrama, la desplaza perpendicularmente a la línea. */
  _tags: [], _labels: {}, _ext: { x1: 1e9, y1: 1e9, x2: -1e9, y2: -1e9 },
  /* ¿Hay un elemento u otra etiqueta ya dibujada en ese punto? */
  busyAt(d, q, w, skip) {
    const hitEl = (d.elements || []).some(e => {
      if ((skip || []).indexOf(e.id) >= 0 || e.type === 'activation') return false;
      const b = Geo.bounds(d, e);
      return q.x + w / 2 > b.x && q.x - w / 2 < b.x + b.w && q.y + 9 > b.y && q.y - 9 < b.y + b.h;
    });
    if (hitEl) return true;
    return Render._tags.some(t =>
      q.x + w / 2 > t.x && q.x - w / 2 < t.x + t.w && q.y + 9 > t.y && q.y - 9 < t.y + t.h);
  },
  freeSpot(d, pt, ang, skip, w) {
    if (!Render.busyAt(d, pt, w, skip)) return pt;
    for (let i = 1; i <= 3; i++) {
      const a = ptAt(pt, ang, 0, -i * 15), b = ptAt(pt, ang, 0, i * 15);
      if (!Render.busyAt(d, a, w, skip)) return a;
      if (!Render.busyAt(d, b, w, skip)) return b;
    }
    return pt;
  },

  /* Título centrado; los nombres de instancia van subrayados. */
  title(g, cx, y, s, size, underline) {
    g.appendChild(txt(cx, y, s, { anchor: 'middle', size: size, weight: '600' }));
    if (underline && s) {
      const w = measure(s, size) * 1.07;
      g.appendChild(line(cx - w / 2, y + 3, cx + w / 2, y + 3, { 'stroke-width': 1.1 }));
    }
  },

  /* ---------------- elementos ---------------- */
  element(d, e) {
    const b = Geo.bounds(d, e);
    const g = el('g', { 'data-id': e.id });
    const box = (o) => el('rect', Object.assign({ x: b.x, y: b.y, width: b.w, height: b.h, fill: P.fill, stroke: P.ink, 'stroke-width': 1.5 }, o || {}));
    const cx = b.x + b.w / 2;

    switch (e.type) {
      case 'actor': case 'participant_actor': {
        Render.actorFigure(g, b, e.name, 1);
        break;
      }
      case 'usecase': {
        g.appendChild(el('ellipse', { cx: cx, cy: b.y + b.h / 2, rx: b.w / 2, ry: b.h / 2, fill: P.fill, stroke: P.ink, 'stroke-width': 1.5 }));
        const ls = wrapText(e.name, 22, 2);
        ls.forEach((L, i) => g.appendChild(txt(cx, b.y + b.h / 2 + 4.5 + (i - (ls.length - 1) / 2) * 14, L, { anchor: 'middle', size: 12.5 })));
        break;
      }
      case 'boundary': {
        g.appendChild(box({ fill: P.fill, stroke: P.muted, rx: 3 }));
        g.appendChild(txt(cx, b.y + 21, e.name, { anchor: 'middle', size: 13, weight: '600', fill: P.muted }));
        break;
      }
      case 'class': case 'interface': {
        const head = Geo.classHead(e), at = e.attributes || [], me = e.methods || [];
        const aH = Math.max(1, at.length) * 16 + 10;
        g.appendChild(box({ rx: 2 }));
        let ty = b.y + 17;
        if (e.stereotype && e.stereotype !== 'class') { g.appendChild(txt(cx, ty - 2, '«' + e.stereotype + '»', { anchor: 'middle', size: 11, fill: P.muted })); ty += 15; }
        g.appendChild(txt(cx, ty, e.name, { anchor: 'middle', size: 13.5, weight: '600', italic: !!e.abstract }));
        g.appendChild(line(b.x, b.y + head, b.x + b.w, b.y + head));
        at.forEach((a, i) => g.appendChild(txt(b.x + 9, b.y + head + 15 + i * 16, Geo.attrText(a), { size: 12 })));
        g.appendChild(line(b.x, b.y + head + aH, b.x + b.w, b.y + head + aH));
        me.forEach((m, i) => g.appendChild(txt(b.x + 9, b.y + head + aH + 15 + i * 16, Geo.methText(m), { size: 12 })));
        break;
      }
      case 'object': {
        const sl = e.slots || [];
        g.appendChild(box({ rx: 2 }));
        Render.title(g, cx, b.y + 19, Geo.objTitle(e), 13, true);
        g.appendChild(line(b.x, b.y + 28, b.x + b.w, b.y + 28));
        sl.forEach((s, i) => g.appendChild(txt(b.x + 9, b.y + 43 + i * 16, Geo.slotText(s), { size: 12 })));
        break;
      }
      case 'role': {
        g.appendChild(box({ rx: 2 }));
        Render.title(g, cx, b.y + b.h / 2 + 4.5, Geo.objTitle(e), 13, true);
        break;
      }
      case 'initial': {
        g.appendChild(el('circle', { cx: cx, cy: b.y + b.h / 2, r: b.w / 2, fill: P.ink }));
        break;
      }
      case 'final': {
        g.appendChild(el('circle', { cx: cx, cy: b.y + b.h / 2, r: b.w / 2, fill: P.fill, stroke: P.ink, 'stroke-width': 1.5 }));
        g.appendChild(el('circle', { cx: cx, cy: b.y + b.h / 2, r: b.w / 2 - 5, fill: P.ink }));
        break;
      }
      case 'state': {
        g.appendChild(box({ rx: 13, ry: 13 }));
        if (e.doActivity) {
          g.appendChild(txt(cx, b.y + 20, e.name, { anchor: 'middle', size: 13, weight: '600' }));
          g.appendChild(line(b.x, b.y + 28, b.x + b.w, b.y + 28));
          g.appendChild(txt(b.x + 10, b.y + 43, 'do / ' + e.doActivity, { size: 11.5, fill: P.muted }));
        } else {
          g.appendChild(txt(cx, b.y + b.h / 2 + 4.5, e.name, { anchor: 'middle', size: 13, weight: '600' }));
        }
        break;
      }
      case 'participant': {
        if (e.variant === 'actor') { Render.actorFigure(g, b, e.name, .85); }
        else {
          g.appendChild(box({ rx: 2 }));
          Render.title(g, cx, b.y + b.h / 2 + 4.5, Geo.objTitle(e), 13, true);
        }
        break;
      }
      case 'activation': {
        g.appendChild(el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, fill: P.fill, stroke: P.ink, 'stroke-width': 1.3 }));
        break;
      }
      case 'fragment': {
        g.appendChild(el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, fill: 'none', stroke: P.ink, 'stroke-width': 1.3 }));
        const w = Math.max(48, measure(e.op, 12) + 26);
        g.appendChild(path('M' + b.x + ' ' + b.y + ' H' + (b.x + w) + ' V' + (b.y + 12) + ' L' + (b.x + w - 11) + ' ' + (b.y + 23) + ' H' + b.x + ' Z', { fill: P.soft, stroke: P.ink, 'stroke-width': 1.3 }));
        g.appendChild(txt(b.x + 9, b.y + 16, e.op || 'alt', { size: 12, weight: '700' }));
        if (e.guard) g.appendChild(Render.tag(b.x + w + 12, b.y + 18, e.guard, { fill: P.muted }));
        if (e.op === 'alt') {
          /* alt tiene dos regiones separadas por una línea discontinua. */
          const sy = Math.round(b.y + b.h * (e.split || .5));
          g.appendChild(line(b.x, sy, b.x + b.w, sy, { 'stroke-dasharray': '7 5', 'stroke-width': 1.2 }));
          g.appendChild(Render.tag(b.x + 10, sy + 15, e.guard2 || '[si no]', { fill: P.muted }));
        }
        break;
      }
      case 'node': {
        const dp = 15, fx = b.x, fy = b.y + dp, fw = b.w - dp, fh = b.h - dp;
        g.appendChild(path('M' + fx + ' ' + fy + ' L' + (fx + dp) + ' ' + b.y + ' H' + (b.x + b.w) + ' L' + (fx + fw) + ' ' + fy + ' Z', { fill: P.soft, stroke: P.ink, 'stroke-width': 1.4 }));
        g.appendChild(path('M' + (fx + fw) + ' ' + fy + ' L' + (b.x + b.w) + ' ' + b.y + ' V' + (b.y + b.h - dp) + ' L' + (fx + fw) + ' ' + (b.y + b.h) + ' Z', { fill: P.soft, stroke: P.ink, 'stroke-width': 1.4 }));
        g.appendChild(el('rect', { x: fx, y: fy, width: fw, height: fh, fill: P.fill, stroke: P.ink, 'stroke-width': 1.5 }));
        const tcx = fx + fw / 2;
        if (e.stereotype) g.appendChild(txt(tcx, fy + 18, '«' + e.stereotype + '»', { anchor: 'middle', size: 11, fill: P.muted }));
        g.appendChild(txt(tcx, fy + (e.stereotype ? 35 : 24), e.name, { anchor: 'middle', size: 13, weight: '600' }));
        break;
      }
      case 'artifact': {
        g.appendChild(box({ rx: 2 }));
        g.appendChild(txt(b.x + 12, b.y + 21, '«' + (e.stereotype || 'artifact') + '»', { size: 11, fill: P.muted }));
        g.appendChild(txt(b.x + 12, b.y + 38, e.name, { size: 12.5, weight: '600' }));
        const ix = b.x + b.w - 22, iy = b.y + 9;
        g.appendChild(path('M' + ix + ' ' + iy + ' h8 l5 5 v10 h-13 Z M' + (ix + 8) + ' ' + iy + ' v5 h5', { fill: 'none', stroke: P.muted, 'stroke-width': 1.2 }));
        break;
      }
      default: {
        g.appendChild(box({ rx: 2 }));
        g.appendChild(txt(cx, b.y + b.h / 2 + 4, e.name, { anchor: 'middle', size: 12 }));
      }
    }
    return g;
  },

  actorFigure(g, b, name, k) {
    const cx = b.x + b.w / 2, top = b.y + 5, r = 10 * k, hy = top + r;
    g.appendChild(el('circle', { cx: cx, cy: hy, r: r, fill: P.fill, stroke: P.ink, 'stroke-width': 1.6 }));
    const bodyTop = hy + r, bodyBot = bodyTop + 28 * k, arms = bodyTop + 9 * k, legY = bodyBot + 22 * k, aw = 16 * k, lw = 13 * k;
    g.appendChild(path('M' + cx + ' ' + bodyTop + ' V' + bodyBot + ' M' + (cx - aw) + ' ' + arms + ' H' + (cx + aw) +
      ' M' + cx + ' ' + bodyBot + ' L' + (cx - lw) + ' ' + legY + ' M' + cx + ' ' + bodyBot + ' L' + (cx + lw) + ' ' + legY,
      { 'stroke-width': 1.6, 'stroke-linecap': 'round' }));
    g.appendChild(txt(cx, b.y + b.h - 3, name, { anchor: 'middle', size: 12, weight: '600' }));
  },

  lifeline(d, p) {
    const x = Geo.lifelineX(d, p), y1 = Geo.lifelineTop(d, p), y2 = Geo.lifelineBottom(d);
    return el('g', { 'data-life': p.id }, [line(x, y1, x, y2, { 'stroke-dasharray': '7 5', stroke: P.muted, 'stroke-width': 1.2 })]);
  },

  actOff(d, p, y) {
    const hit = (d.elements || []).some(a => a.type === 'activation' && a.owner === p.id && y >= a.y - 2 && y <= a.y + (a.h || 80) + 2);
    return hit ? 6 : 0;
  },

  /* ---------------- geometría de relaciones ---------------- */
  relGeom(d, r) {
    const A = byId(d, r.from), B = byId(d, r.to);
    if (!A || !B) return null;
    if (d.type === 'sequence') {
      const y = r.y || 150, xa = Geo.lifelineX(d, A), xb = Geo.lifelineX(d, B);
      if (A.id === B.id) return { kind: 'selfseq', p1: { x: xa + Render.actOff(d, A, y), y: y }, p2: { x: xa + 8, y: y + 34 }, mid: { x: xa + 60, y: y + 14 } };
      const dir = xb > xa ? 1 : -1;
      const p1 = { x: xa + dir * Render.actOff(d, A, y), y: y }, p2 = { x: xb - dir * Render.actOff(d, B, y), y: y };
      return { kind: 'seq', p1: p1, p2: p2, mid: { x: (p1.x + p2.x) / 2, y: y } };
    }
    if (A.id === B.id) {
      const b = Geo.bounds(d, A);
      return { kind: 'self', p1: { x: b.x + b.w * .72, y: b.y }, p2: { x: b.x + b.w * .28, y: b.y }, mid: { x: b.x + b.w / 2, y: b.y - 52 } };
    }
    const pts = Geo.route(d, r);          // la separación de paralelas ya va en Geo.route
    if (!pts) return null;
    const n = pts.length;
    const m = Geo.polyMid(pts);
    return {
      kind: 'poly', pts: pts, p1: pts[0], p2: pts[n - 1], mid: { x: m.x, y: m.y }, ang: m.ang,
      a1: Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x),
      a2: Math.atan2(pts[n - 2].y - pts[n - 1].y, pts[n - 2].x - pts[n - 1].x)
    };
  },

  deco(kind, tip, away) {
    const out = { nodes: [], trim: 0 };
    if (!kind) return out;
    const p = (a, dist, perp) => ptAt(tip, a, dist, perp);
    if (kind === 'arrowOpen') {
      const a = p(away + .40, 13), b = p(away - .40, 13);
      out.nodes.push(path('M' + a.x + ' ' + a.y + ' L' + tip.x + ' ' + tip.y + ' L' + b.x + ' ' + b.y, { 'stroke-width': 1.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    } else if (kind === 'arrowFilled') {
      const a = p(away + .30, 13), b = p(away - .30, 13);
      out.nodes.push(path('M' + tip.x + ' ' + tip.y + ' L' + a.x + ' ' + a.y + ' L' + b.x + ' ' + b.y + ' Z', { fill: P.ink, 'stroke-width': 1 }));
      out.trim = 11;
    } else if (kind === 'triangle') {
      const a = p(away, 14, 8), b = p(away, 14, -8);
      out.nodes.push(path('M' + tip.x + ' ' + tip.y + ' L' + a.x + ' ' + a.y + ' L' + b.x + ' ' + b.y + ' Z', { fill: P.fill, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
      out.trim = 14;
    } else if (kind === 'diamondOpen' || kind === 'diamondFilled') {
      const m1 = p(away, 9, 6), m2 = p(away, 9, -6), far = p(away, 18, 0);
      out.nodes.push(path('M' + tip.x + ' ' + tip.y + ' L' + m1.x + ' ' + m1.y + ' L' + far.x + ' ' + far.y + ' L' + m2.x + ' ' + m2.y + ' Z',
        { fill: kind === 'diamondFilled' ? P.ink : P.fill, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
      out.trim = 18;
    }
    return out;
  },

  /* ---------------- relaciones ---------------- */
  relation(d, r, ctx) {
    const gm = Render.relGeom(d, r);
    if (!gm) return null;
    const def = RDEF[r.type] || {};
    const g = el('g', { 'data-rid': r.id });
    const sel = ctx && ctx.selected && ctx.selected.indexOf(r.id) >= 0;
    const col = sel ? P.sel : P.ink;
    const dash = def.dash ? '7 5' : null;
    const lw = sel ? 2.2 : 1.4;

    if (d.type === 'sequence') { Render.seqMessage(d, r, gm, g, col, ctx); return g; }

    if (gm.kind === 'self') {
      const c1 = { x: gm.p1.x + 36, y: gm.p1.y - 62 }, c2 = { x: gm.p2.x - 36, y: gm.p2.y - 62 };
      const away = Math.atan2(c2.y - gm.p2.y, c2.x - gm.p2.x);
      g.appendChild(path('M' + gm.p1.x + ' ' + gm.p1.y + ' C' + c1.x + ' ' + c1.y + ' ' + c2.x + ' ' + c2.y + ' ' + gm.p2.x + ' ' + gm.p2.y,
        { stroke: col, 'stroke-width': lw, 'stroke-dasharray': dash }));
      Render.deco(def.end, gm.p2, away).nodes.forEach(n => { n.setAttribute('stroke', col); g.appendChild(n); });
      const lbl = Render.relLabel(r, def);
      if (lbl) Render.putLabel(d, r, g, lbl, { x: gm.mid.x, y: gm.mid.y }, 0, col, []);
      return g;
    }

    /* Decoraciones en los extremos y recorte de la polilínea. */
    const pts = gm.pts.map(p => ({ x: p.x, y: p.y }));
    const startKind = def.start || (r.sourceNavigable && def.mult ? 'arrowOpen' : null);
    const endKind = def.end || ((r.targetNavigable || (def.mult && r.targetNavigable)) ? 'arrowOpen' : null);
    const ds = Render.deco(startKind, pts[0], gm.a1);
    const de = Render.deco(endKind, pts[pts.length - 1], gm.a2);
    pts[0] = ptAt(pts[0], gm.a1, ds.trim);
