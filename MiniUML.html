/* =========================================================================
   8. Aplicación: comandos, teclado, proyectos y arranque
   ========================================================================= */

class Application {
  constructor() {
    const ui = StorageManager.loadUI();
    document.documentElement.setAttribute('data-theme', ui.theme === 'light' ? 'light' : 'dark');
    let doc = null;
    try { doc = StorageManager.load(); } catch (e) { doc = null; }
    this.doc = doc || Doc.empty('Proyecto sin título');
    this.sel = [];
    this.tool = { kind: 'select', type: null, variant: null };
    this.clip = null;
    this.inline = null;
    this.oop = { open: false, rows: [] };
    this._t = 0;
    this.hist = new HistoryManager(60);
    this.canvas = new CanvasManager(this);
    this.canvas.grid = ui.grid !== false;
    this.canvas.snapOn = ui.snap !== false;
    this.bind();
    this.hist.reset(this.doc);
    this.refresh();
    this.canvas.fit();
  }

  /* ---------------- estado ---------------- */
  diagram() { const pr = this.doc.project; return pr.diagrams.find(d => d.id === pr.activeId) || pr.diagrams[0]; }
  relById(id) { return (this.diagram().relations || []).find(r => r.id === id); }
  editing() { return !!this.inline; }

  select(ids) { this.sel = ids.slice ? ids.slice() : [ids]; this.refreshSide(); }
  toggleSel(id) { const i = this.sel.indexOf(id); if (i >= 0) this.sel.splice(i, 1); else this.sel.push(id); this.refreshSide(); }
  selectAll() { const d = this.diagram(); this.select((d.elements || []).map(e => e.id)); }
  refreshSide() { Panels.props(this); this.canvas.render(); }

  setTool(t) {
    this.tool = { kind: t.kind, type: t.type || null, variant: t.variant || null };
    this.canvas.cancelPending();
    const c = this.canvas.svg;
    c.classList.toggle('tool-add', t.kind === 'element');
    c.classList.toggle('tool-link', t.kind === 'relation');
    if (t.kind === 'relation') this.hint('Hacé clic en el elemento origen y luego en el destino. (Esc cancela)');
    else if (t.kind === 'element') this.hint('Hacé clic en el lienzo para colocar el elemento.');
    else this.hint('');
    Panels.tools(this);
    this.updateStatus();
  }

  hint(msg) {
    const h = document.getElementById('hint');
    h.textContent = msg || '';
    h.style.display = msg ? 'block' : 'none';
  }

  /* ---------------- persistencia ---------------- */
  autosave() {
    this.setDirty(true);
    clearTimeout(this._t);
    this._t = setTimeout(() => { if (StorageManager.save(this.doc)) this.setDirty(false); }, 500);
  }
  saveNow() {
    clearTimeout(this._t);
    const ok = StorageManager.save(this.doc);
    this.setDirty(!ok);
    return ok;
  }
  /* ✓ Guardado / ● Cambios sin guardar */
  setDirty(v) {
    this.dirty = !!v;
    const n = document.getElementById('saveState');
    if (!n) return;
    n.textContent = this.dirty ? '● Cambios sin guardar' : '✓ Guardado';
    n.className = this.dirty ? 'dirty' : 'saved';
  }
  saveUI() {
    StorageManager.saveUI({
      theme: document.documentElement.getAttribute('data-theme'),
      grid: this.canvas.grid, snap: this.canvas.snapOn
    });
  }
  commit() { clearTimeout(this._h); this.hist.push(this.doc); this.setDirty(true); this.saveNow(); this.refresh(); }
  /* Cambios repetidos y rápidos (flechas del teclado) se agrupan en una sola
     entrada del historial en lugar de una por pulsación. */
  commitSoon() {
    this.renderCanvas(); this.autosave();
    this.setDirty(true);
    clearTimeout(this._h);
    this._h = setTimeout(() => { this.hist.push(this.doc); this.saveNow(); this.refresh(); }, 450);
  }
  renderCanvas() { this.canvas.requestRender(); }

  refresh() {
    Panels.tools(this); Panels.tabs(this); Panels.props(this);
    if (this.oop.open) {
      const dentro = document.activeElement && document.getElementById('oop').contains(document.activeElement);
      if (!dentro) {                                   // no se reconstruye mientras el usuario escribe
        if (this.diagram().type === 'class') { this.oop.rows = Oop.rowsFrom(this.diagram()); Panels.oop(this); }
        else this.oopClose();
      }
    }
    const s = document.getElementById('selType');
    if (s) s.value = this.diagram().type;
    document.getElementById('btnUndo').disabled = !this.hist.canUndo();
    document.getElementById('btnRedo').disabled = !this.hist.canRedo();
    this.canvas.render();
  }
  updateStatus() {
    const d = this.diagram();
    if (!d) return;
    document.getElementById('stLeft').textContent =
      this.doc.project.name + ' · ' + d.name + ' · ' + (d.elements || []).length + ' elementos, ' + (d.relations || []).length + ' relaciones';
    const t = this.tool.kind === 'select' ? 'Seleccionar' : (RDEF[this.tool.type] ? RDEF[this.tool.type].label : (this.tool.type || ''));
    document.getElementById('stRight').textContent = 'Herramienta: ' + t + ' · Zoom ' + Math.round(this.canvas.k * 100) + '%';
  }

  /* ---------------- edición del modelo ---------------- */
  addElementAt(type, pt, variant) {
    const d = this.diagram();
    if (type === 'activation') {
      const p = (d.elements || []).find(e => e.type === 'participant' &&
        Math.abs(Geo.lifelineX(d, e) - pt.x) < 30 && pt.y > Geo.lifelineTop(d, e) - 10);
      if (!p) { UI.toast('Hacé clic sobre una línea de vida para colocar la activación.', 'err'); return; }
      const a = ElementFactory.create('activation', 0, this.canvas.snap(pt.y));
      a.owner = p.id;
      d.elements.push(a);
      this.sel = [a.id]; this.setTool({ kind: 'select' }); this.commit();
      return;
    }
    const isC = CONTAINERS.indexOf(type) >= 0, def = EDEF[type];
    const e = ElementFactory.create(type, 0, 0, variant);
    e.x = this.canvas.snap(isC ? pt.x : pt.x - def.w / 2);
    e.y = this.canvas.snap(isC ? pt.y : pt.y - def.h / 2);
    if (d.type === 'sequence' && type === 'participant') e.y = 40;
    d.elements.push(e);
    const host = Doc.containerAt(d, e);                    // queda dentro del contenedor donde se soltó
    if (host) e.parentId = host.id;
    this.sel = [e.id];
    this.setTool({ kind: 'select' });
    this.commit();
  }

  addRelation(type, from, to) {
    const d = this.diagram();
    const rule = (RULES[d.type] || {})[type];
    const def = RDEF[type] || { label: type };
    const nm = (e) => e.name || Geo.objTitle(e) || e.type;
    if (!rule) {
      UI.toast('⚠ Relación no válida\n\n«' + def.label + '» no existe en un ' + DIAGRAMS[d.type].name.toLowerCase() + '.', 'err');
      return;
    }
    const chk = relationCheck(d.type, type, from, to);
    if (!chk.ok) {
      const elegido = 'Seleccionaste:\n' + TYPE_NAME(from.type) + ' → ' + TYPE_NAME(to.type);
      UI.toast(chk.why === 'self'
        ? '⚠ Relación no válida\n\n«' + def.label + '» no puede unir un elemento consigo mismo.\n\n' + elegido
        : '⚠ Relación no válida\n\n' + def.label + ' requiere:\n' + ruleText(d.type, type) + '\n\n' + elegido, 'err');
      return;
    }

    if (d.type === 'communication' && type === 'message') {
      let c = (d.relations || []).find(r => r.type === 'connector' &&
        ((r.from === from.id && r.to === to.id) || (r.from === to.id && r.to === from.id)));
      if (!c) { c = ElementFactory.relation('connector', from.id, to.id); d.relations.push(c); }
      c.messages = c.messages || [];
      let total = 0;
      (d.relations || []).forEach(r => { total += (r.messages || []).length; });
      c.messages.push({ n: String(total + 1), text: 'mensaje()', dir: c.from === from.id ? 'ab' : 'ba' });
      this.sel = [c.id];
      this.setTool({ kind: 'select' });        // igual que al crear un elemento
      this.commit();
      return;
    }
    const r = ElementFactory.relation(type, from.id, to.id);
    if (d.type === 'sequence') {
      let y = 110, seq = 0;
      (d.relations || []).forEach(m => { y = Math.max(y, (m.y || 0) + 45); seq = Math.max(seq, m.seq || 0); });
      r.y = y; r.seq = seq + 1;
      r.label = type === 'return' ? 'retorno' : 'mensaje()';
    }
    d.relations.push(r);
    if (d.type === 'sequence') { Doc.assignFragment(d, r); Doc.renumber(d); }
    this.sel = [r.id];
    this.setTool({ kind: 'select' });          // vuelve al puntero, como el resto de las herramientas
    this.commit();
  }

  async deleteSelection() {
    const d = this.diagram();
    const elIds = this.sel.filter(id => byId(d, id));
    const relIds = this.sel.filter(id => !byId(d, id));
    if (!elIds.length && !relIds.length) return;
    const attached = (d.relations || []).filter(r =>
      (elIds.indexOf(r.from) >= 0 || elIds.indexOf(r.to) >= 0) && relIds.indexOf(r.id) < 0);
    if (attached.length) {
      const ok = await UI.confirm('Eliminar elemento',
        'Tiene ' + attached.length + ' relación(es) conectada(s). Si continuás, se eliminan también.', 'Eliminar todo');
      if (!ok) return;
    }
    d.relations = (d.relations || []).filter(r => relIds.indexOf(r.id) < 0 && elIds.indexOf(r.from) < 0 && elIds.indexOf(r.to) < 0);
    d.elements = (d.elements || []).filter(e => elIds.indexOf(e.id) < 0 && !(e.type === 'activation' && elIds.indexOf(e.owner) >= 0));
    /* Al quitar un contenedor, sus hijos siguen existiendo: quedan sueltos. */
    (d.elements || []).forEach(e => { if (e.parentId && !byId(d, e.parentId)) delete e.parentId; });
    if (d.type === 'sequence') Doc.renumber(d);
    this.sel = [];
    this.commit();
  }

  pasteInto(pack, dx, dy) {
    const d = this.diagram();
    if (pack.type !== d.type) { UI.toast('Lo copiado pertenece a otro tipo de diagrama.', 'err'); return; }
    const map = {}, news = [];
    pack.elements.forEach(src => {
      const c = clone(src); c.id = uid(src.type); map[src.id] = c.id;
      c.x = (c.x || 0) + dx; c.y = (c.y || 0) + dy;
      news.push({ c: c, srcOwner: src.owner });
    });
    const out = [];
    news.forEach(o => {
      if (o.c.type === 'activation') { if (!map[o.srcOwner]) return; o.c.owner = map[o.srcOwner]; }
      out.push(o.c);
    });
    out.forEach(c => {
      if (c.parentId) { if (map[c.parentId]) c.parentId = map[c.parentId]; else delete c.parentId; }
      d.elements.push(c);
    });
    (pack.relations || []).forEach(r => {
      if (!map[r.from] || !map[r.to]) return;
      const c = clone(r); c.id = uid('r'); c.from = map[r.from]; c.to = map[r.to];
      if (c.y) c.y += dy;
      d.relations.push(c);
    });
    this.sel = out.map(e => e.id);
    this.reparent(this.sel.filter(id => { const e = byId(d, id); return e && !e.parentId; }));
    if (d.type === 'sequence') Doc.renumber(d);
    this.commit();
  }
  /* ---------------- puntos intermedios de las relaciones ---------------- */
  addWaypointAt(r, p) {
    const d = this.diagram();
    const g = Render.relGeom(d, r);
    if (!g || g.kind !== 'poly') { UI.toast('Esta relación no admite puntos intermedios.', 'err'); return; }
    let best = 0, bd = Infinity;
    for (let i = 1; i < g.pts.length; i++) {
      const dist = Geo.distToSeg(p, g.pts[i - 1], g.pts[i]);
      if (dist < bd) { bd = dist; best = i - 1; }
    }
    r.points = r.points || [];
    r.points.splice(Math.min(best, r.points.length), 0, { x: this.canvas.snap(p.x), y: this.canvas.snap(p.y) });
    this.sel = [r.id];
    this.commit();
    UI.toast('Punto agregado. Arrastralo para dar forma a la línea; doble clic lo quita.');
  }
  removeWaypoint(r, i) {
    if (!r.points || i < 0 || i >= r.points.length) return;
    r.points.splice(i, 1);
    this.commit();
  }
  resetRoute(r) {
    r.points = [];
    delete r.labelPosition;
    this.commit();
    UI.toast('Ruta y etiqueta restablecidas', 'ok');
  }
  cleanWaypoints(r) {
    const out = [];
    (r.points || []).forEach(q => {
      const last = out[out.length - 1];
      if (last && Math.abs(last.x - q.x) < 2 && Math.abs(last.y - q.y) < 2) return;   // puntos pegados
      out.push(q);
    });
    r.points = out;
  }
  setRouting(r, mode) {
    r.routing = mode === 'orthogonal' ? 'orthogonal' : 'direct';
    this.commit();
  }

  /* Adelanta o atrasa un mensaje de secuencia intercambiándolo con su vecino. */
  moveMessage(r, dir) {
    const d = this.diagram();
    const ms = Doc.renumber(d);
    const i = ms.indexOf(r), j = i + dir;
    if (i < 0 || j < 0 || j >= ms.length) return;
    const o = ms[j];
    if ((r.y || 0) === (o.y || 0)) { const q = r.seq; r.seq = o.seq; o.seq = q; }
    else { const y = r.y; r.y = o.y; o.y = y; }
    Doc.renumber(d);
    this.commit();
  }

  /* Invierte una relación conservando el significado de cada extremo. */
  flipRelation(t) {
    const f = t.from; t.from = t.to; t.to = f;
    const m = t.sourceMultiplicity; t.sourceMultiplicity = t.targetMultiplicity; t.targetMultiplicity = m;
    const rr = t.sourceRole; t.sourceRole = t.targetRole; t.targetRole = rr;
    const nv = t.sourceNavigable; t.sourceNavigable = t.targetNavigable; t.targetNavigable = nv;
    if ((t.points || []).length) t.points.reverse();
    this.commit();
  }

  /* Recalcula a qué contenedor pertenece cada elemento después de moverlo. */
  reparent(ids) {
    const d = this.diagram();
    let changed = false;
    (ids || []).forEach(id => {
      const e = byId(d, id);
      if (!e || !PARENT_OF[e.type]) return;
      const host = Doc.containerAt(d, e);
      const now = host ? host.id : null;
      if ((e.parentId || null) === now) return;
      if (now) e.parentId = now; else delete e.parentId;
      changed = true;
    });
    return changed;
  }

  pack() {
    const d = this.diagram();
    const els = this.sel.map(id => byId(d, id)).filter(Boolean);
    if (!els.length) return null;
    const ids = els.map(e => e.id);
    return { type: d.type, elements: clone(els), relations: clone((d.relations || []).filter(r => ids.indexOf(r.from) >= 0 && ids.indexOf(r.to) >= 0)) };
  }
  copy() { const p = this.pack(); if (!p) return; this.clip = p; UI.toast(p.elements.length + ' elemento(s) copiado(s)'); }
  paste() { if (!this.clip) { UI.toast('No hay nada para pegar.', 'err'); return; } this.pasteInto(this.clip, 30, 30); }
  duplicateSelection() { const p = this.pack(); if (!p) return; this.pasteInto(p, 24, 24); }

  restore(s) {
    const cur = this.doc.project.activeId;
    this.canvas.pending = null; this.canvas.drag = null; this.canvas.band = null;   // nada apuntando al documento viejo
    this.inline = null; document.getElementById('inlineEdit').style.display = 'none';
    this.doc = s;
    if (s.project.diagrams.some(d => d.id === cur)) s.project.activeId = cur;  // deshacer no cambia de diagrama
    this.sel = []; this.saveNow(); this.refresh();
  }
  undo() { const s = this.hist.undo(); if (s) this.restore(s); }
  redo() { const s = this.hist.redo(); if (s) this.restore(s); }

  /* ---------------- edición en el lienzo ---------------- */
  startInline(t) {
    const d = this.diagram();
    const isRel = !byId(d, t.id);
    if (!isRel && ['initial', 'final', 'activation'].indexOf(t.type) >= 0) return;
    const field = isRel ? (t.type === 'transition' ? 'event' : 'label') : (t.type === 'fragment' ? 'guard' : 'name');
    const inp = document.getElementById('inlineEdit');
    let left, top, width;
    if (isRel) {
      const g = Render.relGeom(d, t); if (!g) return;
      const s = this.canvas.toScreen(g.mid);
      width = 170; left = s.x - width / 2; top = s.y - 24;
    } else {
      const b = Geo.bounds(d, t), s = this.canvas.toScreen({ x: b.x, y: b.y });
      width = Math.max(110, b.w * this.canvas.k); left = s.x; top = s.y + 4;
    }
    inp.style.display = 'block';
    inp.style.left = Math.round(left) + 'px';
    inp.style.top = Math.round(top) + 'px';
    inp.style.width = Math.round(width) + 'px';
    inp.value = t[field] == null ? '' : t[field];
    this.inline = { target: t, field: field, orig: inp.value };
    setTimeout(() => { inp.focus(); inp.select(); }, 0);
  }
  commitInline() {
    const st = this.inline; if (!st) return;
    this.inline = null;
    const inp = document.getElementById('inlineEdit');
    inp.style.display = 'none';
    if (inp.value !== st.orig) { st.target[st.field] = inp.value; this.commit(); }
  }
  cancelInline() {
    this.inline = null;
    document.getElementById('inlineEdit').style.display = 'none';
  }

  /* ---------------- Diseño Orientado a Objetos ---------------- */
  /* La tabla trabaja siempre sobre un diagrama de clases: si el activo es de
     otro tipo, se pasa al de clases (creándolo si hace falta). */
  oopOpen() {
    if (this.diagram().type !== 'class') {
      this.chooseType('class');
      UI.toast('El diseño OO trabaja sobre el diagrama de clases.', 'ok');
    }
    this.oop.rows = Oop.rowsFrom(this.diagram());
    this.oop.open = true;
    document.getElementById('oop').classList.add('show');
    document.getElementById('btnOop').classList.add('on');
    Panels.oop(this);
  }
  oopClose() {
    if (!this.oop.open) return;
    this.oopStore();
    this.oop.open = false;
    document.getElementById('oop').classList.remove('show');
    document.getElementById('btnOop').classList.remove('on');
  }
  oopToggle() { if (this.oop.open) this.oopClose(); else this.oopOpen(); }
  /* Mientras se escribe solo se marca el proyecto como modificado. */
  oopTouched() { this.setDirty(true); }
  /* Al salir de un campo se guarda el texto en el documento (sin historial). */
  oopStore() {
    const d = this.diagram();
    if (!this.oop.open || !d || d.type !== 'class') return;
    Oop.save(d, this.oop.rows);
    this.autosave();
  }
  oopAdd() {
    this.oop.rows.push(Oop.emptyRow());
    this.oopStore();
    Panels.oop(this);
    const filas = document.querySelectorAll('#oopRows tr');
    const ult = filas[filas.length - 1];
    if (ult) { const i = ult.querySelector('input'); if (i) i.focus(); }
  }
  oopDuplicate(rid) {
    const i = this.oop.rows.findIndex(r => r.rid === rid);
    if (i < 0) return;
    const src = this.oop.rows[i];
    this.oop.rows.splice(i + 1, 0, {
      rid: uid('fila'), ref: null,                       // la copia todavía no existe en el diagrama
      name: (src.name || '') + ' copia', attrs: src.attrs, methods: src.methods
    });
    this.oopStore();
    Panels.oop(this);
  }
  async oopRemove(rid) {
    const i = this.oop.rows.findIndex(r => r.rid === rid);
    if (i < 0) return;
    const r = this.oop.rows[i], d = this.diagram();
    const e = r.ref ? byId(d, r.ref) : null;
    if (e) {
      const rels = (d.relations || []).filter(x => x.from === e.id || x.to === e.id).length;
      const ok = await UI.confirm('Quitar clase',
        '«' + (e.name || 'sin nombre') + '» ya está en el diagrama. Se elimina también del lienzo' +
        (rels ? ' junto con sus ' + rels + ' relación(es)' : '') + '.', 'Eliminar');
      if (!ok) return;
      d.relations = (d.relations || []).filter(x => x.from !== e.id && x.to !== e.id);
      d.elements = (d.elements || []).filter(x => x.id !== e.id);
      this.sel = this.sel.filter(id => id !== e.id);
      this.oop.rows.splice(i, 1);
      Oop.save(d, this.oop.rows);
      this.commit();
    } else {
      this.oop.rows.splice(i, 1);
      this.oopStore();
    }
    Panels.oop(this);
  }
  /* Tabla -> modelo -> diagrama, en una sola operación deshacible. */
  oopSync() {
    const d = this.diagram();
    if (!d || d.type !== 'class') { UI.toast('El diseño OO necesita un diagrama de clases.', 'err'); return; }
    const res = Oop.sync(d, this.oop.rows);
    if (res && res.error) {
      const tr = document.querySelector('#oopRows tr[data-rid="' + res.rid + '"]');
      if (tr) { const inp = tr.querySelector('input'); if (inp) { inp.classList.add('bad'); inp.focus(); } }
      UI.toast(res.error === 'duplicada'
        ? '⚠ La clase «' + res.nombre + '» está dos veces en la tabla. Dejá una sola fila.'
        : '⚠ La fila ' + res.fila + ' tiene atributos o métodos pero no tiene nombre de clase.', 'err');
      return;
    }
    this.commit();
    Panels.oop(this);
    const partes = [];
    if (res.creadas) partes.push(res.creadas + ' clase(s) creada(s)');
    if (res.actualizadas) partes.push(res.actualizadas + ' actualizada(s)');
    UI.toast(partes.length ? partes.join(' y ') + ' en el diagrama.' : 'El diagrama ya estaba al día.', 'ok');
  }
  async oopCopy(rich) {
    const rows = Oop.usables(this.oop.rows);
    if (!rows.length) { UI.toast('No hay filas con nombre de clase para copiar.', 'err'); return; }
    const texto = Oop.text(rows);
    const ok = rich ? await Clip.rich(Oop.html(rows), texto) : await Clip.plain(texto);
    UI.toast(ok ? (rich ? 'Tabla copiada' : 'Texto copiado')
      : 'El navegador no permitió usar el portapapeles.', ok ? 'ok' : 'err');
  }

  /* ---------------- proyectos y diagramas ---------------- */
  setActive(id) {
    this.commitInline();
    this.doc.project.activeId = id;
    this.sel = [];
    this.setTool({ kind: 'select' });
    this.refresh();
    this.canvas.fit();
    this.autosave();
  }
  addDiagram(type) {
    const pr = this.doc.project;
    const n = pr.diagrams.filter(d => d.type === type).length;
    const d = Doc.newDiagram(type, DIAGRAMS[type].short + (n ? ' ' + (n + 1) : ''));
    pr.diagrams.push(d); pr.activeId = d.id;
    this.sel = [];
    this.commit();
    this.canvas.fit();
  }
  async removeDiagram(id) {
    const pr = this.doc.project;
    if (pr.diagrams.length <= 1) { UI.toast('El proyecto necesita al menos un diagrama.', 'err'); return; }
    const d = pr.diagrams.find(x => x.id === id);
    const ok = await UI.confirm('Quitar diagrama', 'Se elimina «' + d.name + '» con todo su contenido.', 'Quitar');
    if (!ok) return;
    pr.diagrams = pr.diagrams.filter(x => x.id !== id);
    if (pr.activeId === id) pr.activeId = pr.diagrams[0].id;
    this.sel = [];
    this.commit();
  }
  chooseType(type) {
    const pr = this.doc.project;
    const found = pr.diagrams.find(d => d.type === type);
    if (found) this.setActive(found.id);
    else this.addDiagram(type);
  }
  async newProject() {
    const ok = await UI.confirm('Nuevo proyecto',
      (this.dirty ? 'Hay cambios sin guardar. ' : '') + 'Se descarta el proyecto abierto. Guardalo o exportalo antes si querés conservarlo.', 'Crear');
    if (!ok) { this.refresh(); return; }
    const name = await UI.prompt('Nuevo proyecto', 'Nombre del proyecto', 'Sistema de …');
    this.doc = Doc.empty(name || 'Proyecto sin título');
    this.sel = []; this.hist.reset(this.doc); this.saveNow(); this.refresh(); this.canvas.fit();
    UI.toast('Proyecto creado', 'ok');
  }
  async loadExample() {
    const busy = this.doc.project.diagrams.some(d => (d.elements || []).length);
    if (busy) {
      const ok = await UI.confirm('Cargar ejemplo', 'Se reemplaza el proyecto abierto por el de demostración.', 'Cargar ejemplo');
      if (!ok) return;
    }
    this.doc = Doc.validate(exampleDoc());     // el ejemplo pasa por la misma validación que un archivo
    this.sel = []; this.hist.reset(this.doc); this.saveNow(); this.refresh(); this.canvas.fit();
    UI.toast('Proyecto de ejemplo cargado: Sistema de Biblioteca', 'ok');
  }
  openFile(file) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const doc = Doc.validate(JSON.parse(String(rd.result)));
        const bad = Doc.droppedCount();
        this.doc = doc; this.sel = []; this.hist.reset(doc); this.saveNow(); this.refresh(); this.canvas.fit();
        UI.toast('Proyecto cargado: ' + doc.project.name, 'ok');
        if (bad) UI.toast('Se descartaron ' + bad + ' parte(s) inválida(s) del archivo.', 'err');
      } catch (e) {
        UI.toast('El archivo de proyecto no es válido.', 'err');
      }
    };
    rd.onerror = () => UI.toast('No se pudo leer el archivo.', 'err');
    rd.readAsText(file);
  }

  hideMenus() {
    document.getElementById('ctx').style.display = 'none';
    document.getElementById('exportMenu').classList.remove('open');
  }
  showContext(x, y, kind, pt) { Panels.context(this, x, y, kind, pt); }

  /* ---------------- conexión con el DOM ---------------- */
  bind() {
    const $ = (id) => document.getElementById(id);

    const sel = $('selType');
    sel.innerHTML = DIAGRAM_ORDER.map(t => '<option value="' + t + '">' + DIAGRAMS[t].name + '</option>').join('');
    sel.onchange = () => this.chooseType(sel.value);

    $('btnNew').onclick = () => this.newProject();
    $('btnSave').onclick = () => { this.saveNow(); UI.toast('Proyecto guardado en este navegador', 'ok'); };
    $('btnLoad').onclick = async () => {
      const busy = this.doc.project.diagrams.some(d => (d.elements || []).length);
      if (busy) {
        const ok = await UI.confirm('Cargar proyecto',
          (this.dirty ? 'Hay cambios sin guardar. ' : '') + 'Se reemplaza el proyecto abierto por el del archivo. Exportalo antes si querés conservarlo.', 'Cargar');
        if (!ok) return;
      }
      $('fileIn').click();
    };
    $('fileIn').onchange = (ev) => { const f = ev.target.files[0]; if (f) this.openFile(f); ev.target.value = ''; };
    $('btnUndo').onclick = () => this.undo();
    $('btnRedo').onclick = () => this.redo();
    $('btnExample').onclick = () => this.loadExample();
    $('btnOop').onclick = () => this.oopToggle();
    $('oopClose').onclick = () => this.oopClose();
    $('oopAdd').onclick = () => this.oopAdd();
    $('oopSync').onclick = () => this.oopSync();
    $('oopCopy').onclick = () => this.oopCopy(true);
    $('oopCopyTxt').onclick = () => this.oopCopy(false);
    $('btnAddDiagram').onclick = () => this.addDiagram(sel.value);

    $('btnExport').onclick = (ev) => { ev.stopPropagation(); $('exportMenu').classList.toggle('open'); };
    $('exportMenu').querySelectorAll('button').forEach(b => b.onclick = () => {
      this.hideMenus();
      try {
        if (b.dataset.x === 'json') UI.toast('Exportado: ' + ExportManager.json(this), 'ok');
        if (b.dataset.x === 'svg') UI.toast('Exportado: ' + ExportManager.svg(this), 'ok');
        if (b.dataset.x === 'png') ExportManager.png(this).then(n => UI.toast('Exportado: ' + n, 'ok')).catch(() => UI.toast('No se pudo generar el PNG.', 'err'));
      } catch (e) { UI.toast('No se pudo exportar.', 'err'); }
    });
    document.addEventListener('click', () => this.hideMenus());

    $('btnTheme').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      $('btnTheme').textContent = next === 'dark' ? '☾' : '☀';
      this.saveUI();
    };
    $('btnTheme').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☾' : '☀';

    $('zIn').onclick = () => this.canvas.zoomBy(1.2);
    $('zOut').onclick = () => this.canvas.zoomBy(1 / 1.2);
    $('zFit').onclick = () => this.canvas.fit();
    $('zGrid').onclick = () => { this.canvas.grid = !this.canvas.grid; this.canvas.applyView(); this.syncZoomBar(); this.saveUI(); };
    $('zSnap').onclick = () => { this.canvas.snapOn = !this.canvas.snapOn; this.syncZoomBar(); this.saveUI(); };
    $('btnLeftPanel').onclick = () => $('left').classList.toggle('show');
    $('btnRightPanel').onclick = () => $('right').classList.toggle('show');

    const inp = $('inlineEdit');
    inp.onkeydown = (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); this.commitInline(); }
      else if (ev.key === 'Escape') { ev.preventDefault(); this.cancelInline(); }
      ev.stopPropagation();
    };
    inp.onblur = () => this.commitInline();

    document.addEventListener('keydown', (ev) => this.onKey(ev));
    window.addEventListener('resize', () => this.canvas.applyView());
    window.addEventListener('beforeunload', () => this.saveNow());
    this.syncZoomBar();
  }

  syncZoomBar() {
    document.getElementById('zGrid').classList.toggle('on', this.canvas.grid);
    document.getElementById('zSnap').classList.toggle('on', this.canvas.snapOn);
  }

  onKey(ev) {
    const tag = ((ev.target && ev.target.tagName) || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
    const mod = ev.ctrlKey || ev.metaKey;
    const modal = document.getElementById('modal').classList.contains('open');
    if (modal && ev.key !== 'Escape') return;                 // el diálogo tiene el foco
    if (ev.key === 'Escape') {
      if (typing) { try { ev.target.blur(); } catch (e) { } return; }
      if (this.oop.open) { this.oopClose(); return; }
      if (this.inline) { this.cancelInline(); return; }
      this.canvas.cancelPending(); this.hideMenus(); UI.close();
      if (this.tool.kind !== 'select') this.setTool({ kind: 'select' });
      return;
    }
    if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); this.saveNow(); UI.toast('Proyecto guardado en este navegador', 'ok'); return; }
    if (typing) return;
    if (mod && ev.key.toLowerCase() === 'z') { ev.preventDefault(); if (ev.shiftKey) this.redo(); else this.undo(); return; }
    if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); this.redo(); return; }
    if (mod && ev.key.toLowerCase() === 'c') { ev.preventDefault(); this.copy(); return; }
    if (mod && ev.key.toLowerCase() === 'v') { ev.preventDefault(); this.paste(); return; }
    if (mod && ev.key.toLowerCase() === 'd') { ev.preventDefault(); this.duplicateSelection(); return; }
    if (mod && ev.key.toLowerCase() === 'a') { ev.preventDefault(); this.selectAll(); return; }
    if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); this.deleteSelection(); return; }
    if (ev.key === '+' || ev.key === '=') { this.canvas.zoomBy(1.2); return; }
    if (ev.key === '-') { this.canvas.zoomBy(1 / 1.2); return; }
    if (!mod && this.sel.length && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(ev.key) >= 0) {
      ev.preventDefault();
      const step = ev.shiftKey ? 1 : 10, d = this.diagram();
      const dx = (ev.key === 'ArrowLeft' ? -step : ev.key === 'ArrowRight' ? step : 0);
      const dy = (ev.key === 'ArrowUp' ? -step : ev.key === 'ArrowDown' ? step : 0);
      this.sel.forEach(id => {
        const e = byId(d, id); if (!e) return;
        e.x += dx; e.y += dy;
        Geo.descendants(d, e).forEach(c => { c.x += dx; c.y += dy; });
      });
      this.reparent(this.sel);
      this.commitSoon();
    }
  }
}

/* Superficie mínima para depurar desde la consola del navegador. */
window.MiniUML = {
  Doc: Doc, Geo: Geo, Render: Render, ElementFactory: ElementFactory, ExportManager: ExportManager,
  StorageManager: StorageManager, Panels: Panels, UI: UI, byId: byId, exampleDoc: exampleDoc,
  Oop: Oop, Clip: Clip,
  DIAGRAMS: DIAGRAMS, RULES: RULES, RDEF: RDEF
};

/* ---------------- arranque ---------------- */
let app = null;
function boot() {
  try {
    app = new Application();
    window.app = app;
  } catch (err) {
    console.error(err);
    document.getElementById('stLeft').textContent = 'Ocurrió un error al iniciar MiniUML: ' + err.message;
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
