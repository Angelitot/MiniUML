    pts[pts.length - 1] = ptAt(pts[pts.length - 1], gm.a2, de.trim);
    g.appendChild(path('M' + pts.map(p => p.x + ' ' + p.y).join(' L'), { stroke: col, 'stroke-width': lw, 'stroke-dasharray': dash, 'stroke-linejoin': 'round' }));
    ds.nodes.concat(de.nodes).forEach(n => { n.setAttribute('stroke', col); g.appendChild(n); });

    if (r.type === 'connector' && (r.messages || []).length) {
      /* Los mensajes se apilan al costado del conector, fuera de los roles. */
      const A3 = byId(d, r.from), B3 = byId(d, r.to);
      const ang = gm.ang;
      const nx3 = Math.abs(Math.sin(ang)), ny3 = Math.abs(Math.cos(ang));
      const ext3 = (e) => { const b = Geo.bounds(d, e); return nx3 * b.w / 2 + ny3 * b.h / 2; };
      const off3 = Math.max(14, Math.max(ext3(A3), ext3(B3)) - 8);
      (r.messages || []).forEach((m, i) => {
        const a = m.dir === 'ba' ? ang + Math.PI : ang;
        const base = ptAt(gm.mid, ang, 0, -(off3 + i * 26));
        const s = ptAt(base, a, -10), t = ptAt(base, a, 10);
        g.appendChild(line(s.x, s.y, t.x, t.y, { stroke: col, 'stroke-width': 1.4 }));
        Render.deco('arrowFilled', t, a + Math.PI).nodes.forEach(n => { n.setAttribute('stroke', col); n.setAttribute('fill', col); g.appendChild(n); });
        g.appendChild(Render.tag(base.x, base.y - 10, (m.n || (i + 1)) + ': ' + (m.text || 'mensaje()'), { anchor: 'middle', fill: col }));
      });
    } else {
      const lbl = Render.relLabel(r, def);
      if (lbl) Render.putLabel(d, r, g, lbl, gm.mid, gm.ang, col, [r.from, r.to]);
    }

    if (def.mult) {
      /* Multiplicidad y rol, cada uno junto a SU extremo: la multiplicidad
         pegada al elemento y el rol un poco más adelante, del lado contrario.
         Si el sitio está ocupado por otra etiqueta, se corre por la línea. */
      const put = (p, a, text, perp, dist) => {
        if (!text) return;
        const w = measure(text, 11.5) + 9;
        let q = ptAt(p, a, dist, perp);
        for (let i = 1; i <= 3 && Render.busyAt(d, q, w, [r.from, r.to]); i++) q = ptAt(p, a, dist + i * 17, perp);
        g.appendChild(Render.tag(q.x, q.y, text, { anchor: 'middle', fill: col }));
      };
      put(gm.p1, gm.a1, r.sourceMultiplicity, -11, 19);
      put(gm.p2, gm.a2, r.targetMultiplicity, 11, 19);
      put(gm.p1, gm.a1, r.sourceRole, 13, 45);
      put(gm.p2, gm.a2, r.targetRole, -13, 45);
    }
    return g;
  },

  /* Coloca la etiqueta principal: respeta labelPosition si el usuario la movió,
     y si no busca un lugar que no tape elementos ni otras etiquetas. */
  putLabel(d, r, g, lbl, mid, ang, col, skip) {
    const lw = measure(lbl, 11.5) + 9;
    let lp;
    if (r.labelPosition) {
      lp = { x: mid.x + r.labelPosition.dx, y: mid.y + r.labelPosition.dy };
    } else {
      const A2 = byId(d, r.from), B2 = byId(d, r.to);
      const gap = A2 && B2 ? Math.hypot(Geo.center(Geo.bounds(d, B2)).x - Geo.center(Geo.bounds(d, A2)).x,
        Geo.center(Geo.bounds(d, B2)).y - Geo.center(Geo.bounds(d, A2)).y) : 999;
      lp = { x: mid.x, y: mid.y - 7 };
      /* Hueco real entre las dos cajas medido en la dirección de la línea. */
      const ux = Math.abs(Math.cos(ang)), uy = Math.abs(Math.sin(ang));
      const along = (e) => { const b = Geo.bounds(d, e); return ux * b.w / 2 + uy * b.h / 2; };
      const dist = A2 && B2 ? gap - along(A2) - along(B2) : 999;
      if (A2 && B2 && lw + 12 > Math.max(20, dist)) {
        const nx = Math.abs(Math.sin(ang)), ny = Math.abs(Math.cos(ang));
        const ext = (e) => { const b = Geo.bounds(d, e); return nx * b.w / 2 + ny * b.h / 2; };
        /* Se aparta lo justo: nunca tanto como para despegarse de la línea. */
        const off = Math.min(Math.max(ext(A2), ext(B2)) + 16, 90);
        const u = ptAt(mid, ang, 0, -off), v = ptAt(mid, ang, 0, off);
        lp = !Render.busyAt(d, u, lw, []) ? u : (!Render.busyAt(d, v, lw, []) ? v : lp);
      } else {
        lp = Render.freeSpot(d, lp, ang, skip, lw);
      }
    }
    Render._labels[r.id] = { x: lp.x - lw / 2, y: lp.y - 11, w: lw, h: 16, ax: mid.x, ay: mid.y };
    g.appendChild(Render.tag(lp.x, lp.y, lbl, { anchor: 'middle', fill: col }));
  },

  relLabel(r, def) {
    if (r.type === 'transition') {
      let s = r.event || '';
      if (r.guard) s += ' [' + r.guard + ']';
      if (r.action) s += ' / ' + r.action;
      return s || r.label || '';
    }
    if (def.stereo) return '«' + def.stereo + '»' + (r.label ? ' ' + r.label : '');
    return r.label || '';
  },

  seqMessage(d, r, gm, g, col, ctx) {
    const def = RDEF[r.type] || {};
    const dash = def.dash ? '7 5' : null;
    const num = (ctx && ctx.numbers && ctx.numbers[r.id]) ? ctx.numbers[r.id] + ': ' : '';
    const label = num + (r.label || (r.type === 'return' ? 'retorno' : 'mensaje()'));
    if (gm.kind === 'selfseq') {
      const x = gm.p1.x, y = gm.p1.y;
      g.appendChild(path('M' + x + ' ' + y + ' H' + (x + 46) + ' V' + (y + 34) + ' H' + (x + 6),
        { stroke: col, 'stroke-width': 1.5, 'stroke-dasharray': dash }));
      Render.deco(def.end, { x: x + 6, y: y + 34 }, 0).nodes.forEach(n => { n.setAttribute('stroke', col); if (def.end === 'arrowFilled') n.setAttribute('fill', col); g.appendChild(n); });
      g.appendChild(Render.tag(x + 54, y + 4, label, { fill: col }));
      return;
    }
    const p1 = gm.p1, p2 = gm.p2;
    const ang = p2.x > p1.x ? 0 : Math.PI;
    const de = Render.deco(def.end, p2, ang + Math.PI);
    const q2 = ptAt(p2, ang + Math.PI, de.trim);
    g.appendChild(line(p1.x, p1.y, q2.x, q2.y, { stroke: col, 'stroke-width': 1.6, 'stroke-dasharray': dash }));
    de.nodes.forEach(n => { n.setAttribute('stroke', col); if (def.end === 'arrowFilled') n.setAttribute('fill', col); g.appendChild(n); });
    g.appendChild(Render.tag((p1.x + p2.x) / 2, p1.y - 8, label, { anchor: 'middle', fill: col }));
  },

  /* Numeración automática de los mensajes de un diagrama de secuencia. */
  numbers(d) {
    const map = {};
    if (d.type !== 'sequence' || !(d.options && d.options.numbered)) return map;
    /* Mismo criterio que Doc.renumber: manda la posición vertical y, si dos
       mensajes coinciden, el número que ya tenían. Nunca el orden del arreglo. */
    (d.relations || []).slice()
      .sort((a, b) => (a.y || 0) - (b.y || 0) || (a.seq || 0) - (b.seq || 0))
      .forEach((r, i) => { map[r.id] = i + 1; });
    return map;
  },

  /* Escena completa: capas de fondo, relaciones y elementos. */
  scene(d, ctx) {
    ctx = ctx || {};
    ctx.numbers = Render.numbers(d);
    Render._tags = []; Render._labels = {};
    Render._ext = { x1: 1e9, y1: 1e9, x2: -1e9, y2: -1e9 };
    const back = [], rels = [], els = [];
    if (d.type === 'sequence') {
      /* Orden del fondo: líneas de vida, activaciones y por último los fragmentos,
         para que el rótulo del fragmento quede siempre legible. */
      (d.elements || []).forEach(e => { if (e.type === 'participant') back.push(Render.lifeline(d, e)); });
      (d.elements || []).forEach(e => { if (e.type === 'activation') back.push(Render.element(d, e)); });
      (d.elements || []).forEach(e => { if (CONTAINERS.indexOf(e.type) >= 0) back.push(Render.element(d, e)); });
    } else {
      (d.elements || []).forEach(e => { if (CONTAINERS.indexOf(e.type) >= 0) back.push(Render.element(d, e)); });
    }
    (d.relations || []).forEach(r => { const n = Render.relation(d, r, ctx); if (n) rels.push(n); });
    (d.elements || []).forEach(e => {
      if (CONTAINERS.indexOf(e.type) >= 0) return;
      if (d.type === 'sequence' && e.type === 'activation') return;
      els.push(Render.element(d, e));
    });
    return { back: back, rels: rels, els: els, labels: Render._ext };
  }
};
/* =========================================================================
   4. Lienzo: transformación, detección de clics, arrastre, zoom y selección
   ========================================================================= */

class CanvasManager {
  constructor(app) {
    this.app = app;
    this.svg = document.getElementById('canvas');
    this.stage = document.getElementById('stage');
    this.tx = 60; this.ty = 40; this.k = 1;
    this.grid = true; this.snapOn = true;
    this.pending = null;      // conexión en curso
    this.drag = null;
    this.space = false;
    this._raf = 0;
    this.build();
    this.bind();
  }

  build() {
    const svg = this.svg;
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    const defs = el('defs', null, [
      el('pattern', { id: 'muGrid', width: 20, height: 20, patternUnits: 'userSpaceOnUse' },
        [path('M20 0H0V20', { stroke: P.grid, 'stroke-width': 1 })]),
      el('pattern', { id: 'muGrid100', width: 100, height: 100, patternUnits: 'userSpaceOnUse' },
        [el('rect', { width: 100, height: 100, fill: 'url(#muGrid)' }), path('M100 0H0V100', { stroke: '#d3dbe6', 'stroke-width': 1 })])
    ]);
    svg.appendChild(defs);
    this.vp = el('g', { id: 'vp' });
    this.gGrid = el('rect', { x: -4000, y: -4000, width: 16000, height: 12000, fill: 'url(#muGrid100)' });
    this.gBack = el('g'); this.gRel = el('g'); this.gEl = el('g'); this.gSel = el('g'); this.gTmp = el('g');
    [this.gGrid, this.gBack, this.gRel, this.gEl, this.gSel, this.gTmp].forEach(n => this.vp.appendChild(n));
    svg.appendChild(this.vp);
    this.applyView();
  }

  applyView() {
    this.vp.setAttribute('transform', 'translate(' + this.tx + ',' + this.ty + ') scale(' + this.k + ')');
    this.gGrid.setAttribute('visibility', this.grid ? 'visible' : 'hidden');
    const z = document.getElementById('zoomVal'); if (z) z.textContent = Math.round(this.k * 100) + '%';
  }

  rect() { return this.stage.getBoundingClientRect(); }
  toWorldXY(cx, cy) { const r = this.rect(); return { x: (cx - r.left - this.tx) / this.k, y: (cy - r.top - this.ty) / this.k }; }
  toWorld(ev) { return this.toWorldXY(ev.clientX, ev.clientY); }
  toScreen(p) { const r = this.rect(); return { x: p.x * this.k + this.tx, y: p.y * this.k + this.ty, left: r.left, top: r.top }; }
  snap(v) { return this.snapOn ? Math.round(v / 10) * 10 : Math.round(v); }

  /* ---------------- render ---------------- */
  requestRender() {
    if (this._raf) return;
    this._raf = requestAnimationFrame(() => { this._raf = 0; this.render(); });
  }
  render() {
    const d = this.app.diagram();
    [this.gBack, this.gRel, this.gEl, this.gSel].forEach(g => { while (g.firstChild) g.removeChild(g.firstChild); });
    if (!d) return;
    const sc = Render.scene(d, { selected: this.app.sel });
    sc.back.forEach(n => this.gBack.appendChild(n));
    sc.rels.forEach(n => this.gRel.appendChild(n));
    sc.els.forEach(n => this.gEl.appendChild(n));
    this.drawSelection(d);
    this.app.updateStatus();
  }
  drawSelection(d) {
    const single = this.app.sel.length === 1;
    this.app.sel.forEach(id => {
      const e = byId(d, id);
      if (!e) return;
      const b = Geo.bounds(d, e), m = 4;
      this.gSel.appendChild(el('rect', {
        x: b.x - m, y: b.y - m, width: b.w + m * 2, height: b.h + m * 2, fill: 'none',
        stroke: P.sel, 'stroke-width': 1.4, 'stroke-dasharray': '5 4', rx: 3
      }));
      const corners = [[b.x, b.y], [b.x + b.w, b.y], [b.x, b.y + b.h], [b.x + b.w, b.y + b.h]];
      corners.forEach(c => this.gSel.appendChild(el('rect', { x: c[0] - 3, y: c[1] - 3, width: 6, height: 6, fill: P.sel })));
      if (single && RESIZABLE.indexOf(e.type) >= 0) {
        this.gSel.appendChild(el('rect', { x: b.x + b.w - 1, y: b.y + b.h - 1, width: 11, height: 11, fill: P.fill, stroke: P.sel, 'stroke-width': 1.6, rx: 2 }));
      }
    });
    /* Tiradores de los puntos intermedios de la relación seleccionada. */
    if (this.app.sel.length === 1) {
      const r = this.app.relById(this.app.sel[0]);
      if (r && d.type !== 'sequence') {
        (r.points || []).forEach(q => {
          this.gSel.appendChild(el('rect', { x: q.x - 4.5, y: q.y - 4.5, width: 9, height: 9, fill: P.fill, stroke: P.sel, 'stroke-width': 1.8, rx: 1.5 }));
        });
        const L = Render._labels[r.id];
        if (L) this.gSel.appendChild(el('rect', { x: L.x - 2, y: L.y - 2, width: L.w + 4, height: L.h + 4, fill: 'none', stroke: P.sel, 'stroke-width': 1, 'stroke-dasharray': '3 3', rx: 2 }));
      }
    }
    if (this.pending) {
      const b = Geo.bounds(d, this.pending.el), c = Geo.center(b);
      this.gSel.appendChild(el('rect', { x: b.x - 4, y: b.y - 4, width: b.w + 8, height: b.h + 8, fill: 'none', stroke: P.sel, 'stroke-width': 2, rx: 3 }));
      if (this.pending.to) this.gSel.appendChild(line(c.x, c.y, this.pending.to.x, this.pending.to.y, { stroke: P.sel, 'stroke-width': 1.6, 'stroke-dasharray': '6 4' }));
    }
    if (this.band) {
      const b = this.band;
      this.gSel.appendChild(el('rect', {
        x: Math.min(b.x1, b.x2), y: Math.min(b.y1, b.y2), width: Math.abs(b.x2 - b.x1), height: Math.abs(b.y2 - b.y1),
        fill: P.selSoft, stroke: P.sel, 'stroke-width': 1, 'stroke-dasharray': '4 3'
      }));
    }
  }

  /* ---------------- detección ---------------- */
  hitElement(d, e, p) {
    const b = Geo.bounds(d, e);
    if (e.type === 'usecase') return Geo.inEllipse(b, p);
    if (e.type === 'initial' || e.type === 'final') return Geo.inEllipse(b, p);
    return Geo.inside({ x: b.x - 2, y: b.y - 2, w: b.w + 4, h: b.h + 4 }, p);
  }
  hitContainer(d, e, p) {
    const b = Geo.bounds(d, e);
    if (!Geo.inside(b, p)) return false;
    const band = 12, titleH = e.type === 'node' ? 58 : (e.type === 'fragment' ? 24 : 34);
    return p.x < b.x + band || p.x > b.x + b.w - band || p.y > b.y + b.h - band || p.y < b.y + titleH;
  }
  hitRelation(d, r, p) {
    const g = Render.relGeom(d, r);
    if (!g) return false;
    const tol = 8 / Math.max(.6, this.k);
    if (g.kind === 'self' || g.kind === 'selfseq') return Math.hypot(p.x - g.mid.x, p.y - g.mid.y) < 26;
    if (g.kind === 'poly') {
      for (let i = 1; i < g.pts.length; i++) if (Geo.distToSeg(p, g.pts[i - 1], g.pts[i]) < tol) return true;
      return false;
    }
    return Geo.distToSeg(p, g.p1, g.p2) < tol;
  }
  /* Waypoint bajo el puntero (solo con la relación seleccionada). */
  hitWaypoint(d, p) {
    if (this.app.sel.length !== 1) return null;
    const r = this.app.relById(this.app.sel[0]);
    if (!r || !(r.points || []).length) return null;
    const s = 9 / this.k;
    for (let i = 0; i < r.points.length; i++) {
      const q = r.points[i];
      if (Math.abs(p.x - q.x) < s && Math.abs(p.y - q.y) < s) return { r: r, i: i };
    }
    return null;
  }
  /* Etiqueta de relación bajo el puntero (para moverla). */
  hitLabel(d, p) {
    const rels = d.relations || [];
    for (let i = rels.length - 1; i >= 0; i--) {
      const L = Render._labels[rels[i].id];
      if (!L) continue;
      if (p.x > L.x - 2 && p.x < L.x + L.w + 2 && p.y > L.y - 2 && p.y < L.y + L.h + 2) return { r: rels[i], L: L };
    }
    return null;
  }
  hitHandle(d, p) {
    if (this.app.sel.length !== 1) return null;
    const e = byId(d, this.app.sel[0]);
    if (!e || RESIZABLE.indexOf(e.type) < 0) return null;
    const b = Geo.bounds(d, e), s = 12 / this.k;
    if (p.x > b.x + b.w - s && p.x < b.x + b.w + s && p.y > b.y + b.h - s && p.y < b.y + b.h + s) return e;
    return null;
  }
  hit(p) {
    const d = this.app.diagram(); if (!d) return null;
    const els = d.elements || [];
    for (let i = els.length - 1; i >= 0; i--) {
      const e = els[i];
      if (CONTAINERS.indexOf(e.type) >= 0) continue;
      if (this.hitElement(d, e, p)) return { kind: 'element', e: e };
    }
    for (let i = (d.relations || []).length - 1; i >= 0; i--) {
      if (this.hitRelation(d, d.relations[i], p)) return { kind: 'relation', r: d.relations[i] };
    }
    /* Entre contenedores superpuestos gana el más pequeño (el más interno). */
    let best = null, area = Infinity;
    for (let i = els.length - 1; i >= 0; i--) {
      const e = els[i];
      if (CONTAINERS.indexOf(e.type) < 0) continue;
      if (!this.hitContainer(d, e, p)) continue;
      const b = Geo.bounds(d, e), a = b.w * b.h;
      if (a < area) { area = a; best = e; }
    }
    return best ? { kind: 'element', e: best } : null;
  }

  /* ---------------- eventos ---------------- */
  bind() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', e => this.onDown(e));
    svg.addEventListener('pointermove', e => this.onMove(e));
    window.addEventListener('pointerup', e => this.onUp(e));
    svg.addEventListener('dblclick', e => this.onDbl(e));
    svg.addEventListener('contextmenu', e => this.onCtx(e));
    svg.addEventListener('wheel', e => this.onWheel(e), { passive: false });
    document.addEventListener('keydown', e => {
      const t = ((e.target && e.target.tagName) || '').toLowerCase();
      if (t === 'input' || t === 'textarea' || t === 'select') return;     // se está escribiendo
      if (e.code === 'Space' && !this.app.editing()) { this.space = true; svg.classList.add('panning'); }
    });
    document.addEventListener('keyup', e => { if (e.code === 'Space') { this.space = false; svg.classList.remove('panning'); } });
  }

  onDown(ev) {
    if (ev.button === 2) return;
    this.app.hideMenus();
    this.app.commitInline();
    const p = this.toWorld(ev);
    const d = this.app.diagram();
    try { this.svg.setPointerCapture(ev.pointerId); } catch (e) { }

    if (ev.button === 1 || this.space || ev.altKey) {
      this.drag = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, tx: this.tx, ty: this.ty };
      this.svg.classList.add('panning');
      return;
    }
    const tool = this.app.tool;
    if (tool.kind === 'element') { this.app.addElementAt(tool.type, p, tool.variant); return; }
    if (tool.kind === 'relation') { this.onRelationClick(p); return; }

    const add = ev.shiftKey || ev.ctrlKey || ev.metaKey;     // multiselección
    const wp = this.hitWaypoint(d, p);
    if (wp) {
      this.drag = { kind: 'wp', r: wp.r, i: wp.i, sp: p, x0: wp.r.points[wp.i].x, y0: wp.r.points[wp.i].y };
      return;
    }
    const handle = this.hitHandle(d, p);
    if (handle) {
      const b = Geo.bounds(d, handle);
      this.drag = { kind: 'resize', e: handle, sp: p, w: b.w, h: b.h };
      return;
    }
    const lb = this.hitLabel(d, p);
    if (lb && d.type !== 'sequence') {
      if (this.app.sel.indexOf(lb.r.id) < 0) this.app.select([lb.r.id]);
      /* Si todavía no tiene posición propia, se parte de donde está dibujada
         ahora (que puede estar corrida para no tapar nada). */
      let cur = lb.r.labelPosition;
      if (!cur) {
        const gm = Render.relGeom(d, lb.r);
        cur = gm ? { dx: lb.L.x + lb.L.w / 2 - gm.mid.x, dy: lb.L.y + 10.5 - gm.mid.y } : { dx: 0, dy: 0 };
      }
      this.drag = { kind: 'label', r: lb.r, sp: p, dx0: cur.dx, dy0: cur.dy };
      return;
    }
    const h = this.hit(p);
    if (!h) {
      if (!add) this.app.select([]);
      this.band = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
      this.drag = { kind: 'band' };
      this.requestRender();
      return;
    }
    if (h.kind === 'relation') {
      if (add) this.app.toggleSel(h.r.id); else this.app.select([h.r.id]);
      if (d.type === 'sequence') this.drag = { kind: 'msg', r: h.r, sp: p, y0: h.r.y || 150 };
      return;
    }
    const e = h.e;
    if (add) this.app.toggleSel(e.id);
    else if (this.app.sel.indexOf(e.id) < 0) this.app.select([e.id]);
    this.startMove(p);
  }

  startMove(p) {
    const d = this.app.diagram();
    const roots = this.app.sel.filter(id => byId(d, id));
    const set = {};
    roots.forEach(id => { set[id] = 1; });
    /* Un contenedor arrastra a sus hijos declarados (y a los hijos de estos),
       conservando las posiciones relativas. */
    const msgs = [];
    roots.forEach(id => {
      const e = byId(d, id);
      Geo.descendants(d, e).forEach(c => { set[c.id] = 1; });
      /* En secuencia, el fragmento se lleva los mensajes que tiene declarados. */
      if (d.type === 'sequence' && e.type === 'fragment') {
        const fam = [e.id].concat(Geo.descendants(d, e).map(x => x.id));
        (d.relations || []).forEach(r => {
          if (fam.indexOf(r.parentId) >= 0 && !msgs.some(m => m.r === r)) msgs.push({ r: r, y0: r.y || 0 });
        });
      }
    });
    const orig = {};
    Object.keys(set).forEach(id => { const e = byId(d, id); if (e) orig[id] = { x: e.x, y: e.y }; });
    this.drag = { kind: 'move', sp: p, orig: orig, roots: roots, msgs: msgs, moved: false };
  }

  onMove(ev) {
    const p = this.toWorld(ev);
    if (this.pending) { this.pending.to = p; this.requestRender(); }
    const dr = this.drag;
    if (!dr) return;
    if (dr.kind === 'pan') {
      this.tx = dr.tx + (ev.clientX - dr.sx); this.ty = dr.ty + (ev.clientY - dr.sy);
      this.applyView(); return;
    }
    const d = this.app.diagram();
    if (dr.kind === 'band') { this.band.x2 = p.x; this.band.y2 = p.y; this.requestRender(); return; }
    if (dr.kind === 'wp') {
      dr.r.points[dr.i] = { x: this.snap(dr.x0 + (p.x - dr.sp.x)), y: this.snap(dr.y0 + (p.y - dr.sp.y)) };
      dr.moved = true; this.requestRender(); return;
    }
    if (dr.kind === 'label') {
      dr.r.labelPosition = { dx: Math.round(dr.dx0 + (p.x - dr.sp.x)), dy: Math.round(dr.dy0 + (p.y - dr.sp.y)) };
      dr.moved = true; this.requestRender(); return;
    }
    if (dr.kind === 'msg') { dr.r.y = Math.max(60, this.snap(dr.y0 + (p.y - dr.sp.y))); dr.moved = true; this.requestRender(); return; }
    if (dr.kind === 'resize') {
      const e = dr.e, min = Geo.minSizeIn(d, e);            // nunca por debajo del contenido ni de los hijos
      const nw = Math.max(min.w, this.snap(dr.w + (p.x - dr.sp.x)));
      const nh = Math.max(min.h, this.snap(dr.h + (p.y - dr.sp.y)));
      if (e.type !== 'activation') e.w = nw;
      e.h = nh; dr.moved = true; this.requestRender(); return;
    }
    if (dr.kind === 'move') {
      const dx = p.x - dr.sp.x, dy = p.y - dr.sp.y;
      if (Math.abs(dx) > 1 || Math.abs(dy) > 1) dr.moved = true;
      /* Se imanta el desplazamiento, no cada elemento por separado: así un
         grupo conserva exactamente sus posiciones relativas. */
      const ref = dr.orig[(dr.roots || [])[0]] || dr.orig[Object.keys(dr.orig)[0]] || { x: 0, y: 0 };
      const sdx = this.snap(ref.x + dx) - ref.x, sdy = this.snap(ref.y + dy) - ref.y;
      (dr.msgs || []).forEach(m => { m.r.y = Math.max(60, m.y0 + sdy); });
      Object.keys(dr.orig).forEach(id => {
        const e = byId(d, id); if (!e) return;
        const o = dr.orig[id];
        let nx = o.x + sdx, ny = o.y + sdy;
        if (d.type === 'sequence') {
          if (e.type === 'participant') ny = o.y;                    // los participantes viven en la cabecera
          if (e.type === 'activation') { nx = o.x; ny = Math.max(60, ny); }
        }
        e.x = nx; e.y = ny;
      });
      this.requestRender();
    }
  }

  onUp(ev) {
    const dr = this.drag;
    this.svg.classList.remove('panning');
    if (!dr) return;
    this.drag = null;
    if (dr.kind === 'band') {
      const b = this.band; this.band = null;
      const d = this.app.diagram();
      const r = { x: Math.min(b.x1, b.x2), y: Math.min(b.y1, b.y2), w: Math.abs(b.x2 - b.x1), h: Math.abs(b.y2 - b.y1) };
      if (r.w > 4 && r.h > 4) {
        const ids = (d.elements || []).filter(e => {
          const eb = Geo.bounds(d, e);
          return eb.x < r.x + r.w && eb.x + eb.w > r.x && eb.y < r.y + r.h && eb.y + eb.h > r.y;
        }).map(e => e.id);
        this.app.select(ids);
      } else this.app.refresh();
      return;
    }
    if (dr.moved) {
      if (dr.kind === 'move') this.app.reparent(dr.roots || []);
      if (dr.kind === 'wp') this.app.cleanWaypoints(dr.r);
      const dd = this.app.diagram();
      if (dr.kind === 'msg') { Doc.assignFragment(dd, dr.r); Doc.renumber(dd); }
      if (dr.kind === 'resize' && dr.e && dr.e.type === 'fragment') Doc.assignFragments(dd);
      if (dr.msgs && dr.msgs.length) { Doc.assignFragments(dd); Doc.renumber(dd); }
      this.app.commit();
    } else this.app.refresh();
  }

  onRelationClick(p) {
    const d = this.app.diagram();
    const h = this.hit(p);
    if (!h || h.kind !== 'element') { this.cancelPending(); return; }
    if (!this.pending) {
      this.pending = { el: h.e, to: p };
      this.app.hint('Elemento origen: ' + (h.e.name || h.e.type) + '. Ahora hacé clic en el destino. (Esc cancela)');
      this.requestRender();
      return;
    }
    const from = this.pending.el, to = h.e;
    this.pending = null; this.app.hint('');
    this.app.addRelation(this.app.tool.type, from, to);
  }
  cancelPending() { this.pending = null; this.app.hint(''); this.requestRender(); }

  onDbl(ev) {
    const p = this.toWorld(ev);
    const d = this.app.diagram();
    const wp = this.hitWaypoint(d, p);
    if (wp) { this.app.removeWaypoint(wp.r, wp.i); return; }      // doble clic en un punto lo quita
    const lb = this.hitLabel(d, p);
    if (lb && d.type !== 'sequence') { this.app.select([lb.r.id]); this.app.startInline(lb.r); return; }
    const h = this.hit(p);
    if (!h) return;
    if (h.kind === 'element') { this.app.select([h.e.id]); this.app.startInline(h.e); }
    else { this.app.select([h.r.id]); this.app.addWaypointAt(h.r, p); }
  }

  onCtx(ev) {
    ev.preventDefault();
    const p = this.toWorld(ev);
    const h = this.hit(p);
    if (h) {
      const id = h.kind === 'element' ? h.e.id : h.r.id;
      if (this.app.sel.indexOf(id) < 0) this.app.select([id]);
    } else if (!ev.shiftKey) this.app.select([]);
    const kind = h ? (h.kind === 'relation' ? 'relation' : 'element') : 'canvas';
    this.app.showContext(ev.clientX, ev.clientY, kind, p);
  }

  onWheel(ev) {
    ev.preventDefault();
    if (ev.shiftKey) { this.tx -= ev.deltaY; this.applyView(); return; }
    const w = this.toWorld(ev);
    const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    this.zoomAt(clamp(this.k * f, .25, 3), w, ev.clientX, ev.clientY);
  }
  zoomAt(k, world, cx, cy) {
    const r = this.rect();
    this.k = k;
    this.tx = (cx - r.left) - world.x * k;
    this.ty = (cy - r.top) - world.y * k;
    this.applyView();
  }
  zoomBy(f) {
    const r = this.rect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    this.zoomAt(clamp(this.k * f, .25, 3), this.toWorldXY(cx, cy), cx, cy);
  }
  fit() {
    const d = this.app.diagram(); if (!d) return;
    const r = this.rect(), b = Geo.contentBox(d), pad = 40;
    if (r.width < 80 || r.height < 80) return;                 // el lienzo aún no tiene tamaño
    if (!(d.elements || []).length) { this.k = 1; this.tx = 60; this.ty = 40; this.applyView(); return; }
    const k = clamp(Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h), .25, 2);
    this.k = k;
    this.tx = (r.width - b.w * k) / 2 - b.x * k;
    this.ty = (r.height - b.h * k) / 2 - b.y * k;
    this.applyView();
  }
  centerOn(d) { this.fit(); }
}
/* =========================================================================
   5. Interfaz: herramientas, pestañas, panel de propiedades, menús y avisos
   ========================================================================= */

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const UI = {
  _res: null, _cancel: null,
  toast(msg, kind) {
    const host = document.getElementById('toasts');
    const t = document.createElement('div');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.textContent = msg;
    host.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, 2600);
  },
  /* Cerrar siempre resuelve la promesa pendiente: si no, un Escape dejaba el
     flujo esperando para siempre. */
  close(val) {
    const m = document.getElementById('modal');
    m.classList.remove('open');
    m.querySelector('.box').innerHTML = '';
    const r = UI._res; const c = UI._cancel;
    UI._res = null; UI._cancel = null;
    if (r) r(val === undefined ? c : val);
  },
  open(html, cancelVal, res) {
    const m = document.getElementById('modal'), b = m.querySelector('.box');
    if (UI._res) UI.close();                       // nunca dos modales encimados
    b.innerHTML = html;
    m.classList.add('open');
    UI._res = res; UI._cancel = cancelVal;
    m.onclick = (ev) => { if (ev.target === m) UI.close(); };
    return b;
  },
  prompt(title, label, value) {
    return new Promise(res => {
      const b = UI.open('<h3>' + esc(title) + '</h3><label class="f"><span>' + esc(label) + '</span>' +
        '<input type="text" id="mdIn" value="' + esc(value || '') + '"></label>' +
        '<div class="actions"><button class="tb" id="mdCancel">Cancelar</button><button class="tb" id="mdOk">Aceptar</button></div>', null, res);
      const inp = b.querySelector('#mdIn');
      setTimeout(() => { inp.focus(); inp.select(); }, 0);
      b.querySelector('#mdOk').onclick = () => UI.close(inp.value.trim() || null);
      b.querySelector('#mdCancel').onclick = () => UI.close(null);
      inp.onkeydown = ev => {
        ev.stopPropagation();                      // el atajo global no debe verlo
        if (ev.key === 'Enter') UI.close(inp.value.trim() || null);
        if (ev.key === 'Escape') UI.close(null);
      };
    });
  },
  confirm(title, text, okLabel) {
    return new Promise(res => {
      const b = UI.open('<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p>' +
        '<div class="actions"><button class="tb" id="mdCancel">Cancelar</button><button class="tb danger" id="mdOk">' + esc(okLabel || 'Aceptar') + '</button></div>', false, res);
      setTimeout(() => { const k = b.querySelector('#mdOk'); if (k) k.focus(); }, 0);
      b.querySelector('#mdOk').onclick = () => UI.close(true);
      b.querySelector('#mdCancel').onclick = () => UI.close(false);
    });
  }
};

/* ---------- campos de formulario ---------- */
const F = {
  text: (label, key, val, ph) => '<label class="f"><span>' + esc(label) + '</span><input type="text" data-k="' + key + '" value="' + esc(val) + '" placeholder="' + esc(ph || '') + '"></label>',
  mult: (label, key, val) => '<label class="f"><span>' + esc(label) + '</span><input type="text" list="mults" data-k="' + key + '" value="' + esc(val) + '" placeholder="1, 0..*, …"></label>',
  select: (label, key, val, opts) => '<label class="f"><span>' + esc(label) + '</span><select data-k="' + key + '">' +
    opts.map(o => { const v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : (o === '' ? '(ninguno)' : o); return '<option value="' + esc(v) + '"' + (String(val || '') === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') +
    '</select></label>',
  check: (label, key, val) => '<label class="check"><input type="checkbox" data-k="' + key + '"' + (val ? ' checked' : '') + '> ' + esc(label) + '</label>',
  /* Subir / bajar / quitar para las filas de listas editables. */
  rowBtns: (list, i, n) => '<span class="rowbtns">' +
    '<button class="mini" data-move="' + list + ':' + i + ':-1"' + (i === 0 ? ' disabled' : '') + ' title="Subir">↑</button>' +
    '<button class="mini" data-move="' + list + ':' + i + ':1"' + (i === n - 1 ? ' disabled' : '') + ' title="Bajar">↓</button>' +
    '<button class="mini" data-del="' + list + ':' + i + '" title="Quitar">×</button></span>',
  visOpts: (sel) => VIS_ANY.map(v => '<option value="' + v + '"' + (String(sel == null ? '' : sel) === v ? ' selected' : '') + '>' + (v || '–') + '</option>').join('')
};

const Panels = {
  /* ---------------- herramientas ---------------- */
  tools(app) {
    const host = document.getElementById('tools'), d = app.diagram();
    host.innerHTML = '';
    if (!d) return;
    const groups = [{ g: 'Puntero', items: [T('select', null, 'Seleccionar', ICON.select, 'Seleccionar, mover y editar (Esc)')] }].concat(TOOLBARS[d.type] || []);
    groups.forEach(gr => {
      const box = document.createElement('div');
      box.className = 'toolgrp';
      box.innerHTML = '<h4>' + esc(gr.g) + '</h4>' + gr.items.map(t => {
        const on = app.tool.kind === t.kind && app.tool.type === t.type && (app.tool.variant || '') === (t.variant || '');
        return '<button class="tool' + (on ? ' active' : '') + '" title="' + esc(t.tip || '') + '" data-kind="' + t.kind + '" data-type="' + (t.type || '') + '" data-variant="' + (t.variant || '') + '">' + t.icon + '<span>' + esc(t.label) + '</span></button>';
      }).join('');
      host.appendChild(box);
    });
    host.querySelectorAll('.tool').forEach(btn => {
      btn.onclick = () => app.setTool({ kind: btn.dataset.kind, type: btn.dataset.type || null, variant: btn.dataset.variant || null });
    });
  },

  /* ---------------- pestañas de diagramas ---------------- */
  tabs(app) {
    const host = document.getElementById('tabs'), pr = app.doc.project;
    host.innerHTML = '';
    pr.diagrams.forEach(d => {
      const b = document.createElement('button');
      b.className = 'tab' + (d.id === pr.activeId ? ' active' : '');
      b.title = DIAGRAMS[d.type].name + ' — doble clic para renombrar';
      b.innerHTML = '<span>' + esc(d.name) + '</span>' + (pr.diagrams.length > 1 ? '<span class="x" title="Quitar diagrama">×</span>' : '');
      b.onclick = (ev) => {
        if (ev.target.classList.contains('x')) { app.removeDiagram(d.id); return; }
        app.setActive(d.id);
      };
      b.ondblclick = async () => {
        const n = await UI.prompt('Renombrar diagrama', 'Nombre', d.name);
        if (n) { d.name = n; app.commit(); }
      };
      host.appendChild(b);
    });
  },

  /* ---------------- propiedades ---------------- */
  props(app) {
    const host = document.getElementById('props'), d = app.diagram();
    host.innerHTML = '';
    if (!d) return;
    const sel = app.sel;
    let html = '<datalist id="mults">' + MULTS.filter(Boolean).map(m => '<option value="' + m + '">').join('') + '</datalist>';
    let target = null, isRel = false;

    if (sel.length === 0) {
      html += Panels.diagramForm(app, d);
    } else if (sel.length > 1) {
      html += '<span class="badge">' + sel.length + ' elementos seleccionados</span>' +
        '<p class="empty">Movelos juntos arrastrando, o usá los botones de abajo.</p>' +
        '<div class="actions"><button class="tb" data-act="dup">Duplicar</button><button class="tb danger" data-act="del">Eliminar</button></div>';
    } else {
      const e = byId(d, sel[0]);
      if (e) { target = e; html += Panels.elementForm(d, e); }
      else {
        const r = (d.relations || []).find(x => x.id === sel[0]);
        if (r) { target = r; isRel = true; html += Panels.relationForm(d, r); }
      }
    }
    host.innerHTML = html;
    Panels.bind(app, host, target, isRel);
  },

  diagramForm(app, d) {
    let h = '<span class="badge">' + esc(DIAGRAMS[d.type].name) + '</span>';
    h += F.text('Nombre del proyecto', 'proj:name', app.doc.project.name);
    h += F.text('Nombre del diagrama', 'diag:name', d.name);
    if (d.type === 'sequence' || d.type === 'communication')
      h += F.check('Numerar los mensajes', 'diag:options.numbered', !!(d.options && d.options.numbered));
    h += '<div class="pgroup"><h5>Cómo trabajar aquí</h5><p class="empty">' +
      'Elegí una herramienta de la izquierda y hacé clic en el lienzo para crear.<br>' +
      'Para una relación: clic en el origen y luego en el destino.<br>' +
      'Doble clic edita el nombre. <kbd>Supr</kbd> elimina. <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace.</p></div>';
    h += '<div class="pgroup"><h5>Contenido</h5><p class="empty">' + (d.elements || []).length + ' elementos · ' + (d.relations || []).length + ' relaciones</p></div>';
    return h;
  },

  elementForm(d, e) {
    const T2 = { actor: 'Actor', usecase: 'Caso de uso', boundary: 'Límite del sistema', class: 'Clase', interface: 'Interfaz', object: 'Objeto', initial: 'Estado inicial', state: 'Estado', final: 'Estado final', participant: 'Participante', activation: 'Activación', fragment: 'Fragmento', role: 'Rol / objeto', node: 'Nodo', artifact: 'Artefacto' };
    let h = '<span class="badge">' + esc(T2[e.type] || e.type) + '</span>';

    if (e.type === 'initial' || e.type === 'final') return h + '<p class="empty">Este elemento no tiene propiedades editables.</p>' + Panels.actions();
    if (e.type === 'activation') return h + '<p class="empty">Activación sobre la línea de vida. Arrastrala verticalmente o cambiá su alto tirando del extremo.</p>' + Panels.actions();

    h += '<div class="pgroup" style="border-top:0;margin-top:0;padding-top:0"><h5>General</h5>';
    if (e.type === 'object' || e.type === 'role' || (e.type === 'participant' && e.variant === 'object')) {
      h += F.text('Nombre de la instancia', 'name', e.name, 'cliente1');
      h += F.text('Clase', 'className', e.className, 'Cliente');
    } else {
      h += F.text('Nombre', 'name', e.name);
    }
    h += '</div>';

    if (e.type === 'class' || e.type === 'interface') {
      if (e.type === 'class') { h += '<div class="pgroup"><h5>Opciones</h5>' + F.text('Estereotipo', 'stereotype', e.stereotype, 'p. ej. interface') + F.check('Clase abstracta (nombre en cursiva)', 'abstract', e.abstract) + '</div>'; }
      h += '<div class="pgroup"><h5>Atributos</h5><div class="rowlist">' +
        (e.attributes || []).map((a, i) =>
          '<div class="row attr"><select data-l="attributes" data-i="' + i + '" data-f="vis">' + F.visOpts(a.vis) + '</select>' +
          '<input data-l="attributes" data-i="' + i + '" data-f="name" value="' + esc(a.name) + '" placeholder="nombre">' +
          '<input data-l="attributes" data-i="' + i + '" data-f="type" value="' + esc(a.type) + '" placeholder="tipo">' +
          F.rowBtns('attributes', i, (e.attributes || []).length) + '</div>').join('') +
        '</div><button class="addbtn" data-add="attributes">+ Agregar atributo</button></div>';
      h += '<div class="pgroup"><h5>Operaciones</h5><div class="rowlist">' +
        (e.methods || []).map((m, i) =>
          '<div class="row meth"><select data-l="methods" data-i="' + i + '" data-f="vis">' + F.visOpts(m.vis) + '</select>' +
          '<input data-l="methods" data-i="' + i + '" data-f="name" value="' + esc(m.name) + '" placeholder="operacion">' +
          '<input data-l="methods" data-i="' + i + '" data-f="ret" value="' + esc(m.ret) + '" placeholder="retorno">' +
          F.rowBtns('methods', i, (e.methods || []).length) + '</div>' +
          '<div class="row"><input data-l="methods" data-i="' + i + '" data-f="params" value="' + esc(m.params) + '" placeholder="parámetros"></div>').join('') +
        '</div><button class="addbtn" data-add="methods">+ Agregar operación</button></div>';
    }
    if (e.type === 'object') {
      h += '<div class="pgroup"><h5>Valores de atributos</h5><div class="rowlist">' +
        (e.slots || []).map((s, i) =>
          '<div class="row slot"><input data-l="slots" data-i="' + i + '" data-f="name" value="' + esc(s.name) + '" placeholder="atributo">' +
          '<input data-l="slots" data-i="' + i + '" data-f="value" value="' + esc(s.value) + '" placeholder="valor">' +
          F.rowBtns('slots', i, (e.slots || []).length) + '</div>').join('') +
        '</div><button class="addbtn" data-add="slots">+ Agregar valor</button></div>';
    }
    if (e.type === 'state') h += '<div class="pgroup"><h5>Opciones</h5>' + F.text('Actividad interna (do /)', 'doActivity', e.doActivity, 'opcional') + '</div>';
    if (e.type === 'participant') h += '<div class="pgroup"><h5>Opciones</h5>' + F.select('Representación', 'variant', e.variant, [['object', 'Objeto'], ['actor', 'Actor']]) + '</div>';
    if (e.type === 'fragment') {
      h += '<div class="pgroup"><h5>Opciones</h5>' + F.select('Operador', 'op', e.op, ['alt', 'opt', 'loop', 'par', 'ref']) +
        F.text('Guarda', 'guard', e.guard, '[condición]') +
        (e.op === 'alt' ? F.text('Segunda guarda', 'guard2', e.guard2, '[si no]') : '') + '</div>';
    }
    if (e.type === 'node') h += '<div class="pgroup"><h5>Opciones</h5>' + F.select('Estereotipo', 'stereotype', e.stereotype, STEREO_NODE) + '</div>';
    if (e.type === 'artifact') h += '<div class="pgroup"><h5>Opciones</h5>' + F.text('Estereotipo', 'stereotype', e.stereotype, 'artifact') + '</div>';
    /* Contención: se ve y se puede soltar sin arrastrar. */
    if (PARENT_OF[e.type]) {
      const host = e.parentId ? byId(d, e.parentId) : null;
      h += '<div class="pgroup"><h5>Contenedor</h5><p class="empty">' +
        (host ? 'Dentro de «' + esc(host.name || host.type) + '». Se mueve junto con él.' : 'Suelto en el lienzo. Arrastralo dentro de un contenedor para vincularlo.') +
        '</p>' + (host ? '<button class="tb" data-act="unparent">Sacar del contenedor</button>' : '') + '</div>';
    }
    if (CONTAINERS.indexOf(e.type) >= 0) {
      const n = Geo.childrenOf(d, e).length;
      h += '<div class="pgroup"><h5>Contenido</h5><p class="empty">' + n + ' elemento(s) dentro. Al moverlo se mueven con él y no puede achicarse por debajo de ellos.</p></div>';
    }
    return h + Panels.actions();
  },

  relationForm(d, r) {
    const def = RDEF[r.type] || {};
    const A = byId(d, r.from), B = byId(d, r.to);
    const nm = (e) => e ? esc((e.name || Geo.objTitle(e) || TYPE_NAME(e.type))) : '?';
    let h = '<span class="badge">' + esc(def.label || r.type) + '</span>';
    h += '<p class="empty" style="margin-top:-4px">' + nm(A) + ' → ' + nm(B) + '</p>';

    if (r.type === 'transition') {
      h += '<div class="pgroup" style="border-top:0;margin-top:0;padding-top:0"><h5>Transición</h5>' +
        F.text('Evento', 'event', r.event, 'aprobar') +
        F.text('Guarda', 'guard', r.guard, 'saldo > 0') +
        F.text('Acción', 'action', r.action, 'registrar') +
        '<p class="empty">Se dibuja como: evento [guarda] / acción</p></div>';
    } else if (r.type === 'connector') {
      const ms = r.messages || [];
      h += '<div class="pgroup" style="border-top:0;margin-top:0;padding-top:0"><h5>Mensajes</h5><div class="rowlist">' +
        ms.map((m, i) =>
          '<div class="row msg"><input data-l="messages" data-i="' + i + '" data-f="n" value="' + esc(m.n) + '" placeholder="1">' +
          '<input data-l="messages" data-i="' + i + '" data-f="text" value="' + esc(m.text) + '" placeholder="mensaje()">' +
          '<select data-l="messages" data-i="' + i + '" data-f="dir" title="Dirección">' +
          '<option value="ab"' + (m.dir !== 'ba' ? ' selected' : '') + '>' + nm(A).slice(0, 1) + '→' + nm(B).slice(0, 1) + '</option>' +
          '<option value="ba"' + (m.dir === 'ba' ? ' selected' : '') + '>' + nm(B).slice(0, 1) + '→' + nm(A).slice(0, 1) + '</option></select>' +
          F.rowBtns('messages', i, ms.length) + '</div>').join('') +
        '</div><button class="addbtn" data-add="messages">+ Agregar mensaje</button>' +
        '<button class="addbtn" data-act="renum" style="margin-top:5px">Renumerar 1, 2, 3…</button></div>';
    } else if (d.type === 'sequence') {
      h += F.text('Mensaje', 'label', r.label, 'realizarCompra()');
      h += F.select('Tipo', 'type', r.type, [['message', 'Mensaje'], ['return', 'Retorno']]);
      const total = (d.relations || []).length;
      h += '<div class="pgroup"><h5>Orden en el tiempo</h5><p class="empty">Mensaje ' + (r.seq || 1) + ' de ' + total + '. Arrastralo en el lienzo o usá estos botones.</p>' +
        '<div class="actions"><button class="tb" data-act="up"' + ((r.seq || 1) <= 1 ? ' disabled' : '') + '>↑ Antes</button>' +
        '<button class="tb" data-act="down"' + ((r.seq || 1) >= total ? ' disabled' : '') + '>↓ Después</button></div></div>';
    } else {
      h += F.text('Nombre de la relación', 'label', r.label, 'opcional');
    }

    if (def.mult) {
      h += '<div class="pgroup"><h5>Extremo origen — ' + nm(A) + '</h5>' +
        F.mult('Multiplicidad', 'sourceMultiplicity', r.sourceMultiplicity) +
        F.text('Rol', 'sourceRole', r.sourceRole, 'opcional') +
        F.check('Navegable hacia el origen', 'sourceNavigable', r.sourceNavigable) + '</div>';
      h += '<div class="pgroup"><h5>Extremo destino — ' + nm(B) + '</h5>' +
        F.mult('Multiplicidad', 'targetMultiplicity', r.targetMultiplicity) +
        F.text('Rol', 'targetRole', r.targetRole, 'opcional') +
        F.check('Navegable hacia el destino', 'targetNavigable', r.targetNavigable) + '</div>';
    }

    if (d.type !== 'sequence') {
      const np = (r.points || []).length;
      h += '<div class="pgroup"><h5>Ruta</h5>' +
        F.select('Trazado', 'routing', r.routing || 'direct', [['direct', 'Directa'], ['orthogonal', 'Ortogonal']]) +
        '<p class="empty">' + (np ? np + ' punto(s) intermedio(s).' : 'Sin puntos intermedios.') +
        '<br>Doble clic sobre la línea agrega un punto; doble clic sobre un punto lo quita.' +
        (r.labelPosition ? '<br>La etiqueta fue movida a mano.' : '') + '</p>' +
        ((np || r.labelPosition) ? '<button class="addbtn" data-act="reset">Restablecer ruta y etiqueta</button>' : '') +
        '</div>';
    }
    return h + '<div class="actions"><button class="tb" data-act="flip">Invertir sentido</button><button class="tb danger" data-act="del">Eliminar</button></div>';
  },

  actions() {
    return '<div class="actions"><button class="tb" data-act="dup">Duplicar</button><button class="tb danger" data-act="del">Eliminar</button></div>';
  },

  bind(app, host, target, isRel) {
    const d = app.diagram();
    host.querySelectorAll('[data-k]').forEach(inp => {
      const key = inp.dataset.k;
      const set = () => {
        const v = inp.type === 'checkbox' ? inp.checked : inp.value;
        if (key.indexOf('proj:') === 0) app.doc.project[key.slice(5)] = v;
        else if (key.indexOf('diag:') === 0) {
          const k = key.slice(5);
          if (k.indexOf('options.') === 0) { d.options = d.options || {}; d.options[k.slice(8)] = v; }
          else d[k] = v;
        } else if (target) {
          if (key === 'type' && isRel) { target.type = v; }
          else target[key] = v;
        }
      };
      if (inp.tagName === 'SELECT' || inp.type === 'checkbox') {
        inp.onchange = () => { set(); app.commit(); };
      } else {
        inp.oninput = () => { set(); app.renderCanvas(); app.autosave(); };
        inp.onchange = () => { set(); app.commit(); };
      }
    });
    host.querySelectorAll('[data-l]').forEach(inp => {
      const l = inp.dataset.l, i = +inp.dataset.i, f = inp.dataset.f;
      const set = () => { if (target && target[l] && target[l][i]) target[l][i][f] = inp.value; };
      if (inp.tagName === 'SELECT') inp.onchange = () => { set(); app.commit(); };
      else { inp.oninput = () => { set(); app.renderCanvas(); app.autosave(); }; inp.onchange = () => { set(); app.commit(); }; }
    });
    host.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
      const l = b.dataset.add;
      target[l] = target[l] || [];
      if (l === 'attributes') target[l].push({ vis: '-', name: 'atributo', type: 'String' });
      else if (l === 'methods') target[l].push({ vis: '+', name: 'operacion', params: '', ret: 'void' });
      else if (l === 'slots') target[l].push({ name: 'atributo', value: '"valor"' });
      else if (l === 'messages') target[l].push({ n: String(target[l].length + 1), text: 'mensaje()', dir: 'ab' });
      app.commit();
    });
    host.querySelectorAll('[data-move]').forEach(b => b.onclick = () => {
      const p = b.dataset.move.split(':'), l = p[0], i = +p[1], dir = +p[2];
      const list = target && target[l];
      if (!list || !list[i] || !list[i + dir]) return;
      const q = list[i]; list[i] = list[i + dir]; list[i + dir] = q;
      app.commit();
    });
    host.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const p = b.dataset.del.split(':');
      if (target && target[p[0]]) { target[p[0]].splice(+p[1], 1); app.commit(); }
    });
    host.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'del') app.deleteSelection();
      if (a === 'dup') app.duplicateSelection();
      if (a === 'flip' && target) app.flipRelation(target);
      if (a === 'reset' && target) app.resetRoute(target);
      if (a === 'renum' && target) {
        (target.messages || []).forEach((m, i) => { m.n = String(i + 1); });
        app.commit();
      }
      if (a === 'unparent' && target) { delete target.parentId; app.commit(); }
      if ((a === 'up' || a === 'down') && target) app.moveMessage(target, a === 'up' ? -1 : 1);
    });
  },

  /* ---------------- Diseño Orientado a Objetos ---------------- */
  /* Dibuja la tabla a partir de app.oop.rows. Solo se reconstruye ante cambios
     de estructura (abrir, agregar, quitar, sincronizar): mientras se escribe
     únicamente se guarda el texto en la fila, sin rehacer el SVG. */
  oop(app) {
    const host = document.getElementById('oopRows');
    if (!host) return;
    const rows = app.oop.rows;
    host.innerHTML = rows.map((r, i) =>
      '<tr data-rid="' + r.rid + '">' +
      '<td class="c1"><input type="text" data-f="name" value="' + esc(r.name) + '" placeholder="Cliente" spellcheck="false"></td>' +
      '<td><textarea data-f="attrs" rows="3" spellcheck="false" placeholder="nombre&#10;apellido&#10;telefono">' + esc(r.attrs) + '</textarea></td>' +
      '<td><textarea data-f="methods" rows="3" spellcheck="false" placeholder="realizarCompra()&#10;realizarPago()">' + esc(r.methods) + '</textarea></td>' +
      '<td class="c4">' +
      '<button class="mini" data-r="dup" title="Duplicar fila">⧉</button>' +
      '<button class="mini" data-r="del" title="Quitar fila">×</button></td></tr>').join('');
    document.getElementById('oopEmpty').style.display = rows.length ? 'none' : 'block';

    host.querySelectorAll('tr').forEach(tr => {
      const r = rows.find(x => x.rid === tr.dataset.rid);
      tr.querySelectorAll('[data-f]').forEach(inp => {
        const f = inp.dataset.f;
        inp.oninput = () => { r[f] = inp.value; inp.classList.remove('bad'); Panels.grow(inp); app.oopTouched(); };
        inp.onchange = () => { r[f] = inp.value; app.oopStore(); };
        Panels.grow(inp);
      });
      tr.querySelectorAll('[data-r]').forEach(b => {
        b.onclick = () => { if (b.dataset.r === 'dup') app.oopDuplicate(r.rid); else app.oopRemove(r.rid); };
      });
    });
    Panels.oopFoot(app);
  },
  /* Los textarea crecen con su contenido para que nada quede oculto. */
  grow(inp) {
    if (inp.tagName !== 'TEXTAREA') return;
    inp.style.height = 'auto';
    inp.style.height = Math.max(62, (inp.scrollHeight || 0) + 3) + 'px';
  },
  oopFoot(app) {
    const f = document.getElementById('oopFoot');
    if (!f) return;
    const rows = app.oop.rows;
    const enDiagrama = rows.filter(r => r.ref && byId(app.diagram(), r.ref)).length;
    f.textContent = rows.length + ' fila(s) · ' + enDiagrama + ' ya en el diagrama · ' +
      'Sincronizar crea o actualiza las clases; las relaciones las hacés vos en el lienzo.';
  },

  /* ---------------- menú contextual ---------------- */
  context(app, x, y, kind, pt) {
    const m = document.getElementById('ctx');
    const d = app.diagram();
    const r = kind === 'relation' ? app.relById(app.sel[0]) : null;
    const items = kind === 'element'
      ? [['edit', 'Editar nombre'], ['dup', 'Duplicar'], ['copy', 'Copiar'], ['-', ''], ['del', 'Eliminar']]
      : kind === 'relation'
        ? (d.type === 'sequence'
          ? [['edit', 'Editar mensaje'], ['-', ''], ['del', 'Eliminar']]
          : [['edit', 'Editar etiqueta'], ['point', 'Agregar punto aquí'],
             ['route', (r && r.routing === 'orthogonal') ? 'Trazado directo' : 'Trazado ortogonal'],
             ['reset', 'Restablecer ruta'], ['flip', 'Invertir sentido'], ['-', ''], ['del', 'Eliminar']])
        : [['paste', 'Pegar'], ['all', 'Seleccionar todo'], ['-', ''], ['fit', 'Ajustar al lienzo']];
    m.innerHTML = items.map(it => it[0] === '-' ? '<hr>' : '<button data-c="' + it[0] + '">' + it[1] + '</button>').join('');
    m.style.display = 'block';
    const w = m.offsetWidth || 190, h = m.offsetHeight || 160;
    m.style.left = Math.min(x, innerWidth - w - 8) + 'px';
    m.style.top = Math.min(y, innerHeight - h - 8) + 'px';
    m.querySelectorAll('button').forEach(b => b.onclick = () => {
      const c = b.dataset.c;
      m.style.display = 'none';
      if (c === 'edit') { const e = byId(app.diagram(), app.sel[0]) || (app.diagram().relations || []).find(r => r.id === app.sel[0]); if (e) app.startInline(e); }
      if (c === 'dup') app.duplicateSelection();
      if (c === 'copy') app.copy();
      if (c === 'del') app.deleteSelection();
      if (c === 'paste') app.paste();
      if (c === 'all') app.selectAll();
      if (c === 'fit') app.canvas.fit();
      if (c === 'point' && r) app.addWaypointAt(r, pt);
      if (c === 'route' && r) app.setRouting(r, r.routing === 'orthogonal' ? 'direct' : 'orthogonal');
      if (c === 'reset' && r) app.resetRoute(r);
      if (c === 'flip' && r) app.flipRelation(r);
    });
  }
};
/* =========================================================================
   6. Exportación: proyecto en JSON, diagrama en SVG y en PNG
   ========================================================================= */

const slug = (s) => String(s || 'diagrama').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'diagrama';

const ExportManager = {
  /* base64 de un texto UTF-8 (btoa solo acepta bytes: «», ñ y las tildes
     rompen la conversión directa). */
  b64utf8(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '', step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    return btoa(bin);
  },

  download(name, data, mime) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  },

  json(app) {
    const name = slug(app.doc.project.name) + '.miniuml.json';
    ExportManager.download(name, JSON.stringify(app.doc, null, 2), 'application/json');
    return name;
  },

  /* Devuelve el diagrama como SVG independiente (sin la interfaz). */
  /* Caja del diagrama incluyendo las etiquetas de las relaciones, que pueden
     sobresalir de los elementos. Hay que construir la escena primero. */
  box(d, sc) {
    const b = Geo.contentBox(d), L = sc && sc.labels;
    let x1 = b.x, y1 = b.y, x2 = b.x + b.w, y2 = b.y + b.h;
    if (L && L.x2 > -1e8) { x1 = Math.min(x1, L.x1); y1 = Math.min(y1, L.y1); x2 = Math.max(x2, L.x2); y2 = Math.max(y2, L.y2); }
    return { x: x1, y: y1, w: Math.max(40, x2 - x1), h: Math.max(40, y2 - y1) };
  },

  svgString(d) {
    const pad = 26;
    const sc = Render.scene(d, { selected: [] });
    const b = ExportManager.box(d, sc);
    const x = Math.round(b.x - pad), y = Math.round(b.y - pad);
    const w = Math.round(b.w + pad * 2), h = Math.round(b.h + pad * 2);
    /* El serializador agrega solo el xmlns: no hay que repetirlo o el XML queda inválido. */
    const root = el('svg', { width: w, height: h, viewBox: x + ' ' + y + ' ' + w + ' ' + h, version: '1.1' });
    root.appendChild(el('rect', { x: x, y: y, width: w, height: h, fill: '#ffffff' }));
    const g = el('g');
    sc.back.concat(sc.rels, sc.els).forEach(n => g.appendChild(n));
    root.appendChild(g);
    return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(root);
  },

  svg(app) {
    const d = app.diagram();
    const name = slug(d.name) + '.svg';
    ExportManager.download(name, ExportManager.svgString(d), 'image/svg+xml;charset=utf-8');
    return name;
  },

  png(app) {
    const d = app.diagram(), scale = 2;
    const str = ExportManager.svgString(d);          // deja Render._ext actualizado
    const b = ExportManager.box(d, { labels: Render._ext }), pad = 26;
    const w = Math.round(b.w + pad * 2), h = Math.round(b.h + pad * 2);
    return new Promise((res, rej) => {
      let url = null, usedBlob = false;
      const cleanup = () => { if (url && usedBlob) URL.revokeObjectURL(url); };
      const img = new Image();
      img.onload = () => {
        try {
          const cv = document.createElement('canvas');
          cv.width = Math.max(1, w * scale); cv.height = Math.max(1, h * scale);
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
          ctx.drawImage(img, 0, 0, cv.width, cv.height);
          cleanup();
          cv.toBlob(bl => {
            if (!bl) { rej(new Error('png')); return; }
            const name = slug(d.name) + '.png';
            ExportManager.download(name, bl);
            res(name);
          }, 'image/png');
        } catch (e) { cleanup(); rej(e); }
      };
      img.onerror = () => {
        if (usedBlob) {                       // reintento con data URL en UTF-8
          cleanup(); usedBlob = false;
          img.src = 'data:image/svg+xml;base64,' + ExportManager.b64utf8(str);
          return;
        }
        rej(new Error('png'));
      };
      try {
        url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml;charset=utf-8' }));
        usedBlob = true;
        img.src = url;
      } catch (e) {
        img.src = 'data:image/svg+xml;base64,' + ExportManager.b64utf8(str);
      }
    });
  }
};
